<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ferrum">
<title>FERRUM — Factory Tycoon</title>
<style>
:root{
  --ink:#1d2742; --mut:#6a7896; --soft:#97a3bb; --line:#e4e9f2; --bg2:#f3f6fb;
  --green:#22c55e; --greenD:#15803d; --blue:#3b82f6; --blueD:#1e4fc4; --orange:#f59e0b; --orangeD:#b45309;
  --purple:#8b5cf6; --purpleD:#5b2fc0; --red:#ef4444; --redD:#a61f1f;
  --sl:var(--sl,env(safe-area-inset-left)); --sr:var(--sr,env(safe-area-inset-right)); --sb:var(--sb,env(safe-area-inset-bottom)); --st:var(--st,env(safe-area-inset-top));
  --font:"SF Pro Rounded",ui-rounded,"Nunito","Varela Round","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;min-height:100lvh;overflow:hidden;background:#8fd06a;color:var(--ink);font-family:var(--font);font-size:13px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#game{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}
#game>*{pointer-events:auto}#game>#hud,#game>#toasts,#game>#fx,#game>#tipbox{pointer-events:none}#tipbox>*{pointer-events:auto}
#cv{position:absolute;left:0;top:0;z-index:0;width:100vw;height:100vh;height:100lvh;touch-action:none;cursor:grab}
#cv.drag{cursor:grabbing}#cv.hover{cursor:pointer}
.coin{display:inline-grid;place-items:center;width:1.25em;height:1.25em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff4c2,#fbbf24 45%,#d97706);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.2);color:#92400e;font-weight:900;font-size:.8em;vertical-align:-.2em;flex:none}
.coin:after{content:"$"}
.gi{display:grid;place-items:center;border-radius:50%;flex:none;color:#fff;font-weight:900;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.pico{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--c);color:rgba(255,255,255,.95);font-size:15px;font-weight:900;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);flex:none;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.thumb{width:38px;height:38px;flex:none;border-radius:12px;background:linear-gradient(#eef3f9,#dfe7f1);box-shadow:inset 0 -3px 0 rgba(29,39,66,.1);object-fit:contain;padding:2px}
/* HUD */
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;gap:8px;padding:10px max(10px,var(--sr)) 0 max(10px,var(--sl));pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
.pill{background:rgba(255,255,255,.96);border-radius:16px;box-shadow:0 4px 0 rgba(29,39,66,.12),0 8px 20px -8px rgba(29,39,66,.35);display:flex;align-items:center;gap:8px;padding:6px 12px 6px 7px;height:46px}
.pill .gi{width:32px;height:32px;font-size:16px}
.pill .v{font-weight:900;font-size:17px;line-height:1;font-variant-numeric:tabular-nums}
.pill .s{font-size:10.5px;color:var(--mut);font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.pill.money{min-width:178px}
.pill.money .gi{width:34px;height:34px;font-size:15px;background:radial-gradient(circle at 35% 30%,#fff4c2,#fbbf24 45%,#d97706);color:#92400e}
.pill.money .s{color:#16a34a}
.pill.pow{min-width:150px;cursor:pointer}
.pill.pow .gi{background:linear-gradient(#fde047,#f59e0b)}
.pbar{height:7px;border-radius:5px;background:#e8edf5;overflow:hidden;margin-top:4px;width:100px}
.pbar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#4ade80,#22c55e);transition:width .3s}
.pbar i.hot{background:linear-gradient(90deg,#fb923c,#ef4444)}
.pill.pow.warn{animation:shake .5s infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.pill.rp .gi{background:linear-gradient(#60a5fa,#2563eb)}
.pill.pat .gi{background:linear-gradient(#c4b5fd,#7c3aed)}
.sp{flex:1}
.buymode{display:flex;gap:3px;padding:4px;height:46px;align-items:center}
.buymode .lbl{font-size:9.5px;font-weight:900;color:var(--soft);text-transform:uppercase;letter-spacing:.08em;padding:0 4px 0 6px;line-height:1.1;text-align:center}
.buymode button{height:36px;min-width:42px;padding:0 9px;border-radius:11px;font-weight:900;font-size:13px;color:var(--mut)}
.buymode button.on{background:var(--blue);color:#fff;box-shadow:inset 0 -3px 0 var(--blueD)}
/* mission */
#quest{position:absolute;left:max(10px,var(--sl));top:64px;width:250px;background:rgba(255,255,255,.96);border-radius:16px;padding:10px 12px;box-shadow:0 4px 0 rgba(29,39,66,.12),0 10px 24px -10px rgba(29,39,66,.4);z-index:4;transition:transform .3s}
#quest .qh{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:900;letter-spacing:.12em;color:var(--orangeD);text-transform:uppercase}
#quest .qh i{width:18px;height:18px;border-radius:6px;background:var(--orange);display:grid;place-items:center;color:#fff;font-style:normal;font-size:11px}
#quest .qt{font-weight:800;font-size:13px;margin:5px 0 6px;line-height:1.25}
#quest .qb{height:9px;border-radius:6px;background:#eef2f8;overflow:hidden}
#quest .qb i{display:block;height:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);width:0;transition:width .3s;border-radius:6px}
#quest .qf{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11px;color:var(--mut);font-weight:700}
#quest .qf b{color:var(--ink)}
#quest.done{animation:glowq 1.2s infinite}
@keyframes glowq{50%{box-shadow:0 4px 0 rgba(29,39,66,.12),0 0 0 4px rgba(34,197,94,.45)}}
#quest .claim{display:none;width:100%;margin-top:7px}
#quest.done .claim{display:flex}
#quest.hide{transform:translateX(-130%)}
/* dock */
#dock{position:absolute;left:50%;bottom:max(10px,var(--sb));transform:translateX(-50%);display:flex;gap:4px;background:rgba(255,255,255,.96);border-radius:22px;padding:6px;box-shadow:0 4px 0 rgba(29,39,66,.12),0 12px 28px -10px rgba(29,39,66,.45);z-index:5}
#dock button{width:64px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 3px;border-radius:15px;position:relative;font-size:10.5px;font-weight:800;color:var(--mut)}
#dock button .gi{width:38px;height:38px;font-size:18px;border-radius:13px;transition:transform .15s}
#dock button:active .gi{transform:scale(.9)}
#dock button.on{background:var(--bg2);color:var(--ink)}
#dock .bdg{position:absolute;top:0;right:9px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:900;display:none;place-items:center;padding:0 4px;border:2px solid #fff}
.zoomctl{position:absolute;right:max(10px,var(--sr));bottom:max(12px,var(--sb));display:flex;flex-direction:column;gap:6px;z-index:4}
.zoomctl button{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.96);box-shadow:0 3px 0 rgba(29,39,66,.12);font-size:20px;font-weight:900;color:var(--mut)}
/* panneaux de ligne */
#signs{position:absolute;inset:0;pointer-events:none;z-index:2}
.sign{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:7px;background:#fff;border-radius:15px;padding:4px 5px 4px 4px;box-shadow:0 3px 0 rgba(29,39,66,.15),0 8px 18px -8px rgba(29,39,66,.5);white-space:nowrap;transform-origin:0 0;cursor:pointer;will-change:transform}
.sign .thumb{width:36px;height:36px;border-radius:11px}
.sign .nm{font-weight:900;font-size:12.5px;line-height:1.1}
.sign .nm b{color:var(--c2,#64748b)}
.sign .st{font-size:10.5px;font-weight:800;color:var(--mut);display:flex;align-items:center;gap:4px;margin-top:2px}
.sign .st i{width:8px;height:8px;border-radius:50%;background:#94a3b8;flex:none}
.sign .st i.ok{background:#22c55e}.sign .st i.warn{background:#f59e0b}.sign .st i.bad{background:#ef4444;animation:blink .8s infinite}
@keyframes blink{50%{opacity:.3}}
.sign .bb{margin-left:3px}
.sign.locked{background:#fffbea;outline:2px dashed #f59e0b;outline-offset:-2px}
.sign.sel{box-shadow:0 0 0 3px var(--blue),0 8px 18px -8px rgba(29,39,66,.5)}
/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 13px;border-radius:12px;font-weight:900;font-size:13px;color:#fff;background:var(--green);box-shadow:inset 0 -4px 0 var(--greenD);transition:transform .08s,filter .15s;white-space:nowrap;line-height:1.1}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 -2px 0 var(--greenD)}
.btn.blue{background:var(--blue);box-shadow:inset 0 -4px 0 var(--blueD)}
.btn.orange{background:var(--orange);box-shadow:inset 0 -4px 0 var(--orangeD)}
.btn.purple{background:var(--purple);box-shadow:inset 0 -4px 0 var(--purpleD)}
.btn.red{background:var(--red);box-shadow:inset 0 -4px 0 var(--redD)}
.btn.gray{background:#e7ecf4;color:var(--ink);box-shadow:inset 0 -4px 0 #c8d1df}
.btn:disabled{background:#cfd6e2;box-shadow:inset 0 -4px 0 #b5bfcf;color:#8792a8;cursor:default}
.btn.sm{min-height:32px;padding:0 10px;font-size:12px;border-radius:11px}
.btn.lg{min-height:52px;font-size:15px;border-radius:15px;flex-direction:column;gap:1px}
.btn.lg small{font-size:12px;font-weight:800;opacity:.92;display:flex;align-items:center;gap:4px}
.btn .coin{font-size:12px}
.btn.hint{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1);filter:brightness(1.12)}}
/* tiroir */
#sheet{position:absolute;top:66px;right:max(10px,var(--sr));bottom:86px;width:380px;background:#fff;border-radius:22px;box-shadow:0 5px 0 rgba(29,39,66,.12),0 24px 50px -16px rgba(29,39,66,.55);z-index:6;display:flex;flex-direction:column;transform:translateX(calc(100% + 80px + var(--sr)));transition:transform .28s cubic-bezier(.2,.9,.3,1),visibility .28s;overflow:hidden;visibility:hidden}
#sheet.on{transform:none;visibility:visible}
.shd{display:flex;align-items:center;gap:10px;padding:12px 13px 10px 13px;border-bottom:2px solid var(--line)}
.shd .gi,.shd .pico{width:40px;height:40px;font-size:20px;border-radius:13px}
.shd .thumb{width:46px;height:46px}
.shd h2{font-size:17px;font-weight:900;line-height:1.1}
.shd small{display:block;font-size:11.5px;color:var(--mut);font-weight:700;margin-top:2px}
.shd .x{margin-left:auto;width:36px;height:36px;border-radius:12px;background:var(--bg2);font-size:16px;font-weight:900;color:var(--mut);flex:none}
.sbd{flex:1;overflow-y:auto;padding:12px 13px 18px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.box{background:var(--bg2);border-radius:15px;padding:11px 12px;margin-bottom:9px}
.box.w{background:#fff;border:2px solid var(--line)}
.ttl{font-size:10.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin:12px 3px 7px}
.ttl:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:9px}
.kv{background:var(--bg2);border-radius:13px;padding:8px 9px}
.kv label{display:block;font-size:9.5px;font-weight:900;color:var(--soft);text-transform:uppercase;letter-spacing:.08em}
.kv b{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.rec{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:8px;background:var(--bg2);border-radius:14px;margin-bottom:9px;font-weight:800;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:11px;padding:4px 9px 4px 4px;box-shadow:0 2px 0 rgba(29,39,66,.08)}
.chip .pico{width:24px;height:24px;font-size:12px;border-radius:8px}
.arrow{color:var(--soft);font-weight:900;font-size:16px}
.status{border-radius:15px;padding:11px 12px;margin-bottom:9px;font-weight:800;font-size:12.5px;line-height:1.4}
.status.ok{background:#dcfce7;color:#166534}.status.warn{background:#fef3c7;color:#92400e}.status.bad{background:#fee2e2;color:#991b1b}.status.idle{background:var(--bg2);color:var(--mut)}
.status .btn{margin-top:8px;width:100%}
.status small{display:block;font-weight:700;opacity:.8;margin-top:3px}
.bar{height:10px;border-radius:6px;background:#e5eaf2;overflow:hidden;margin:6px 0 3px}
.bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--c,#f59e0b),color-mix(in srgb,var(--c,#f59e0b) 70%,#fff));transition:width .3s}
.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mut{color:var(--mut)} .sm{font-size:11.5px} .b9{font-weight:900}
.tog{display:flex;align-items:center;gap:10px;font-weight:800;font-size:12.5px}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{display:none}
.sw span{position:absolute;inset:0;border-radius:15px;background:#d5dce8;transition:.2s;cursor:pointer;box-shadow:inset 0 2px 3px rgba(0,0,0,.1)}
.sw span:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 3px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--green)}
.sw input:checked+span:after{left:21px}
.item{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:9px 10px;margin-bottom:8px}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:13px;font-weight:900}
.item .tx small{display:block;font-size:11px;color:var(--mut);font-weight:700;line-height:1.3}
.item.lock{opacity:.6;background:var(--bg2)}
.item.done{border-color:#bbf7d0;background:#f0fdf4}
.item.ready{border-color:#22c55e}
.item .bar{height:7px;margin:5px 0 0}
.mguide{max-width:440px}
.mg{text-align:left;display:flex;flex-direction:column;gap:7px;margin-top:6px}
.mg>div{display:flex;gap:10px;align-items:flex-start;background:var(--bg2);border-radius:13px;padding:8px 10px}
.mg span{width:28px;height:28px;flex:none;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px}
.mg p{margin:0!important;font-size:12.5px!important;line-height:1.4!important;color:var(--mut)}.mg p b{color:var(--ink)}
.mg-ex{display:flex;gap:10px;align-items:center;text-align:left;background:#fff7ed;border:2px solid #fed7aa;border-radius:13px;padding:8px 10px;font-size:12.5px;font-weight:700;color:var(--mut)}.mg-ex b{color:var(--ink)}
.face{width:54px;height:54px;flex:none;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c);margin:3px 4px 3px 3px}
.face.off{filter:grayscale(1);opacity:.55}
.tabs{display:flex;gap:4px;background:var(--bg2);border-radius:14px;padding:4px;margin:10px 0 11px}
.tabs button{flex:1;height:38px;border-radius:11px;font-weight:900;font-size:12.5px;color:var(--mut);position:relative;display:flex;align-items:center;justify-content:center;gap:5px}
.tabs button.on{background:#fff;color:#1d4ed8;box-shadow:0 2px 0 rgba(29,39,66,.1)}
.tabs .tb{position:absolute;top:-9px;right:-5px;min-width:24px;height:24px;border-radius:11px;background:var(--red);color:#fff;font-size:12px;font-weight:900;display:none;place-items:center;padding:0 6px;border:2px solid #fff;box-shadow:0 2px 6px rgba(239,68,68,.5);animation:pulse 1.1s infinite}
.tabs button.hot{box-shadow:0 0 0 2px #f87171;color:#b91c1c}
.tabs .tb:not(:empty){display:inline-grid}
.teaser{width:100%;display:flex;align-items:center;gap:10px;background:#eff6ff;border:2px solid #93c5fd;border-radius:16px;padding:9px 10px;margin-bottom:10px;animation:glowq 1.6s infinite}
.teaser small b{display:inline;font-size:inherit;color:var(--ink)}
.teaser.calm{animation:none;background:#fffbeb;border-color:#fde68a}
.teaser .tbn{min-width:24px;height:24px;border-radius:12px;background:var(--red);color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;padding:0 6px;border:2px solid #fff;animation:pulse 1.1s infinite}
.teaser b{display:block;font-size:13px;font-weight:900}.teaser small{display:block;font-size:11px;font-weight:700;color:var(--mut)}
.labflow{display:flex;gap:4px;align-items:stretch;margin-bottom:10px}
.labflow>div{flex:1;background:#eff6ff;border-radius:13px;padding:7px 4px 6px;text-align:center;font-size:10.5px;font-weight:800;color:#3b5b9a;line-height:1.25}
.labflow>div b{display:block;font-size:16px;color:#1d4ed8;font-weight:900}
.labflow>div .gi{width:26px;height:26px;font-size:13px;margin:0 auto 3px;border-radius:9px}
.labflow .ar{flex:none;align-self:center;color:#93c5fd;font-weight:900;font-size:15px;background:none;padding:0}
.disc{background:linear-gradient(160deg,#eff6ff,#dbeafe);border:2px solid #93c5fd;border-radius:18px;padding:11px;margin-bottom:9px}
.disc.ready{border-color:#22c55e;background:linear-gradient(160deg,#f0fdf4,#dcfce7);animation:glowq 1.2s infinite}
.disc .top{display:flex;gap:11px;align-items:center}
.disc .thumb{width:66px;height:66px;border-radius:16px;background:#fff}
.disc .nm{font-size:16px;font-weight:900}
.disc .un{font-size:12px;font-weight:800;color:#1d4ed8;margin-top:1px}
.disc .eta{font-size:11.5px;font-weight:800;color:var(--mut)}
.disc .btn{width:100%;margin-top:8px}
.ugi{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:17px;font-weight:900;color:#fff;background:linear-gradient(#93c5fd,#3b82f6)}
.achg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ach{background:var(--bg2);border-radius:13px;padding:8px 8px 7px;position:relative;opacity:.75}
.ach.ok{background:linear-gradient(160deg,#fefce8,#fde68a);opacity:1;box-shadow:inset 0 0 0 2px #facc15}
.ach .aic{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:#cbd5e1;color:#fff;font-weight:900;font-size:12px;margin-bottom:3px}
.ach.ok .aic{background:#eab308}
.ach b{display:block;font-size:11.5px;font-weight:900;line-height:1.15}.ach small{display:block;font-size:10px;font-weight:700;color:var(--mut);line-height:1.2;margin-top:1px}
.ach .bar{height:5px;margin:5px 0 0}.ach.ok .bar{display:none}
.statg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.statg .st{background:var(--bg2);border-radius:13px;padding:8px 9px;display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center}
.statg .st span{grid-row:span 2;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px}
.statg .st b{font-size:13.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.statg .st small{font-size:9.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.tbl{width:100%;border-collapse:collapse;font-size:12px;font-weight:700}
.tbl td{padding:7px 3px;border-bottom:2px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td:first-child{white-space:normal}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:10px}
.stages div{height:32px;border-radius:10px;background:var(--bg2);display:grid;place-items:center;font-weight:900;color:var(--soft)}
.stages div.done{background:#fde68a;color:#92400e}
.stages div.cur{background:var(--orange);color:#fff;box-shadow:inset 0 -3px 0 var(--orangeD)}
.hero{text-align:center;padding:14px 10px}
.hero .big{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}
textarea{width:100%;height:90px;background:var(--bg2);border:2px solid var(--line);border-radius:12px;color:var(--ink);padding:8px;font-family:ui-monospace,monospace;font-size:10.5px;resize:none;user-select:text;-webkit-user-select:text}
/* sélecteur de machines */
.units{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.units::-webkit-scrollbar{display:none}
.unit{flex:none;width:58px;border-radius:13px;background:var(--bg2);padding:6px 4px 5px;text-align:center;font-weight:900;font-size:10.5px;color:var(--mut);border:2px solid transparent;position:relative}
.unit b{display:block;font-size:13px;color:var(--ink)}
.unit.on{border-color:var(--blue);background:#eff6ff}
.unit.add{border:2px dashed #cbd5e1;background:#fff;color:var(--soft)}
.unit.add.ok{border-color:var(--green);color:var(--greenD);background:#f0fdf4}
.unit .up{position:absolute;top:-6px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--green);color:#fff;font-size:10px;display:grid;place-items:center;border:2px solid #fff}
.lvlcard{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#f8fafc,#eef3f9);border-radius:16px;padding:10px 12px;margin-bottom:9px;border:2px solid var(--line)}
.lvlbadge{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:#fff;font-weight:900;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);line-height:1}
.lvlbadge small{display:block;font-size:9.5px;opacity:.9;letter-spacing:.06em}
.lvlbadge b{font-size:22px}
.stars{color:#f59e0b;font-size:12px;letter-spacing:1px}
/* toasts */
#toasts{position:absolute;top:66px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:8}
.toast{background:#fff;border-radius:14px;padding:8px 15px 8px 8px;font-weight:800;font-size:12.5px;box-shadow:0 4px 0 rgba(29,39,66,.12),0 12px 26px -10px rgba(29,39,66,.5);display:flex;align-items:center;gap:9px;animation:tin .4s cubic-bezier(.2,1.4,.4,1);white-space:nowrap}
.toast .gi{width:26px;height:26px;font-size:13px;border-radius:9px}
.toast.out{animation:tout .35s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.85)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px) scale(.95)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.flycoin{position:absolute;width:22px;height:22px;font-size:13px;transition:transform .12s ease-out}
#modal{position:fixed;inset:0;background:rgba(20,28,48,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;place-items:center;z-index:20;padding:12px}
#modal.on{display:grid}
.mbox{background:#fff;border-radius:24px;padding:22px 22px 18px;width:min(420px,100%);max-height:100%;overflow:auto;box-shadow:0 6px 0 rgba(29,39,66,.15),0 30px 70px rgba(10,15,30,.45);animation:tin .4s cubic-bezier(.2,1.3,.4,1);text-align:center}
.mbox .ill{width:64px;height:64px;font-size:30px;border-radius:20px;margin:0 auto 10px}
.mbox h2{font-size:20px;font-weight:900;margin-bottom:6px}
.mbox p{color:var(--mut);font-weight:700;line-height:1.45;margin-bottom:8px;font-size:13px}
.mbox .acts{display:flex;gap:8px;margin-top:14px}
.mbox .acts .btn{flex:1}
.tips{text-align:left;background:var(--bg2);border-radius:14px;padding:10px 12px;margin:10px 0 4px;font-weight:700;font-size:12.5px;line-height:1.6;color:var(--ink)}
/* tutoriel */
.tuto{width:min(520px,100%);padding:0;overflow:hidden;display:flex;text-align:left}
.tuto .art{width:42%;min-height:250px;display:grid;place-items:center;position:relative;flex:none}
.tuto .art img{width:78%;max-width:170px;filter:drop-shadow(0 10px 12px rgba(0,0,0,.18));animation:floaty 2.4s ease-in-out infinite}
.tuto .art .big{font-size:64px;animation:floaty 2.4s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-8px)}}
.tuto .art .tag{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#fff;border-radius:10px;padding:4px 10px;font-weight:900;font-size:11px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.tuto .txt{flex:1;padding:22px 20px 16px;display:flex;flex-direction:column}
.tuto .step{font-size:10.5px;font-weight:900;letter-spacing:.12em;color:var(--soft);text-transform:uppercase}
.tuto h2{font-size:20px;margin:6px 0 8px}
.tuto p{font-size:13px;line-height:1.5}
.tuto p b{color:var(--ink)}
.tuto .dots{display:flex;gap:6px;margin-top:auto;padding-top:12px}
.tuto .dots i{width:8px;height:8px;border-radius:4px;background:#dbe2ec;transition:width .2s}
.tuto .dots i.on{width:22px;background:var(--orange)}
.tuto .acts{margin-top:12px}
/* petits écrans */
#event{position:absolute;top:66px;left:50%;transform:translateX(-50%);width:min(330px,calc(100% - 20px));background:#fff;border-radius:16px;padding:8px 10px 9px 8px;display:none;gap:9px;align-items:center;z-index:6;box-shadow:0 4px 0 rgba(29,39,66,.12),0 12px 26px -10px rgba(29,39,66,.5);border:2px solid #fde68a;cursor:pointer;animation:tin .4s cubic-bezier(.2,1.4,.4,1)}
#event.on{display:flex}#event.bad{border-color:#fca5a5;animation:tin .4s,hlr 1s infinite}
#event .ic{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:17px;color:#fff;font-weight:900}
#event .tx{flex:1;min-width:0}#event b{display:block;font-size:12.5px;font-weight:900;line-height:1.2}#event small{display:block;font-size:11px;font-weight:700;color:var(--mut);margin-top:1px}
#event .bar{height:7px;margin:4px 0 0}
body.evon #toasts{top:132px}
#tip{position:absolute;left:50%;bottom:calc(max(10px,var(--sb)) + 84px);transform:translateX(-50%);width:min(430px,calc(100% - 20px));background:#fff;border-radius:18px;padding:11px 12px 11px 11px;display:flex;gap:11px;align-items:flex-start;box-shadow:0 4px 0 rgba(29,39,66,.12),0 16px 34px -10px rgba(29,39,66,.55);z-index:7;border:2px solid #fde68a;animation:tin .45s cubic-bezier(.2,1.4,.4,1)}
#tip.out{animation:tout .3s forwards}
#tip .ic{width:36px;height:36px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:18px;background:linear-gradient(#fde68a,#f59e0b);color:#fff;font-weight:900}
#tip .tx{flex:1;min-width:0}
#tip .tx>b{display:block;font-size:14px;font-weight:900;margin-bottom:2px}#tip p b{color:var(--ink)}
#tip p{margin:0;font-size:12.5px;font-weight:700;color:var(--mut);line-height:1.35}
#tip .acts{display:flex;gap:6px;margin-top:8px}
#tip .acts .btn{min-height:32px;font-size:12.5px;padding:0 12px;border-radius:11px}
#dock button.hl .gi{animation:pulse .9s infinite;box-shadow:0 0 0 3px #fde047}
.hlr{animation:hlr 1s infinite}
@keyframes hlr{50%{box-shadow:0 0 0 4px #fde047,0 10px 24px -10px rgba(29,39,66,.4)}}
#quest{cursor:pointer}
#quest .qh .more{margin-left:auto;font-size:10px;letter-spacing:.02em;color:var(--mut);text-transform:none;font-weight:800}
.qhero{background:linear-gradient(160deg,#fff7ed,#ffedd5);border:2px solid #fdba74;border-radius:18px;padding:12px;margin-bottom:9px}
.qhero .qt2{font-size:16px;font-weight:900;line-height:1.25}
.qhow{background:#fff;border-radius:13px;padding:9px 10px;margin-top:9px;font-size:12.5px;font-weight:700;line-height:1.4;color:var(--ink)}
.qhow .lb{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#ea580c;margin-bottom:2px}
@media (max-height:500px){
  #hud{padding-top:6px;gap:5px}
  .pill{height:38px;border-radius:13px;padding:4px 9px 4px 5px;gap:6px}
  .pill .gi{width:26px;height:26px;font-size:13px}
  .pill.money .gi{width:28px;height:28px;font-size:13px}
  .pill .v{font-size:14px}.pill .s{font-size:9.5px;margin-top:1px}
  .pill.money{min-width:128px}.pill.pow{min-width:112px}
  .pbar{width:74px;height:6px;margin-top:3px}
  .buymode{height:38px;padding:3px}.buymode button{height:31px;min-width:34px;padding:0 6px;font-size:11.5px;border-radius:9px}.buymode .lbl{display:none}
  #quest{top:auto;bottom:max(8px,var(--sb));width:196px;padding:7px 9px;border-radius:13px}
  #quest.hide{transform:translateY(150%)}
  #quest .qt{font-size:11.5px;margin:3px 0 4px}#quest .qh{font-size:9px}#quest .qf{display:none}
  #dock{bottom:max(6px,var(--sb));padding:4px;border-radius:17px;gap:2px}
  #dock button{width:56px;font-size:9px;gap:1px;padding:2px 0 1px;white-space:nowrap}
  #dock button .gi{width:28px;height:28px;font-size:14px;border-radius:9px}
  #dock .bdg{right:8px;min-width:16px;height:16px;font-size:9px}
  #sheet{top:50px;bottom:max(6px,var(--sb));width:320px;border-radius:18px}
  .shd{padding:7px 9px 6px 10px}.shd .thumb{width:36px;height:36px}.shd .gi{width:32px;height:32px;font-size:16px}.shd h2{font-size:15px}
  .sbd{padding:9px 10px 14px}
  .zoomctl{bottom:max(8px,var(--sb));gap:4px}.zoomctl button{width:34px;height:34px;font-size:17px;border-radius:11px}
  .btn.lg{min-height:46px;font-size:14px}
  #toasts{top:50px}
  #event{top:50px;width:min(300px,calc(100% - 20px));padding:6px 8px}#event .ic{width:28px;height:28px;font-size:14px}body.evon #toasts{top:108px}
  #tip{top:auto;bottom:calc(max(6px,var(--sb)) + 62px);width:min(360px,calc(100% - 20px));padding:8px 9px}#tip p{font-size:11.5px}#tip b{font-size:13px}#tip .ic{width:30px;height:30px;font-size:15px}#tip .acts{margin-top:5px}
  .sign{padding:3px 4px 3px 3px;gap:5px;border-radius:12px}.sign .thumb{width:28px;height:28px;border-radius:9px}
  .sign .nm{font-size:11.5px}.sign .st{font-size:9.5px;margin-top:1px}.sign .btn.sm{min-height:28px;padding:0 8px;font-size:11px;border-radius:9px}
  .tuto .art{min-height:200px;width:36%}.tuto .txt{padding:16px 16px 12px}.tuto h2{font-size:17px}.tuto p{font-size:12px}
  .mbox{padding:16px 16px 14px}
}
@media (max-width:760px){ .pill.rp{display:none} }
/* ---------- portrait ---------- */
@media (orientation:portrait) and (max-width:820px){
  #hud{padding:max(8px,var(--st)) max(8px,var(--sr)) 0 max(8px,var(--sl));gap:5px}
  .pill{height:42px;border-radius:14px;padding:4px 6px 4px 5px;gap:4px;flex:1 1 0;min-width:0}
  .pill>div:last-child{min-width:0;overflow:hidden}
  .pill .gi,.pill.money .gi{width:24px;height:24px;font-size:12px}

  .pill .v{font-size:14px;white-space:nowrap}.pill .s{font-size:9.5px;white-space:nowrap}
  #hPow{font-size:10.5px!important;letter-spacing:-.02em}.pbar{width:100%}
  .pill.rp{display:flex}.pill.pat .s,.pill.rp .s{display:none}
  .sp{display:none}
  .buymode{position:absolute;right:max(8px,var(--sr));top:calc(max(8px,var(--st)) + 48px);height:auto;padding:3px;gap:2px;flex:none;border-radius:13px}

  #quest .qt{font-size:12px;margin:3px 0 5px}#quest .qh{font-size:9px}#quest .qf{display:none}#quest .qh .more{font-size:9px;letter-spacing:0}

  #quest.hide{transform:translateY(-180%)}
  #dock{left:max(6px,var(--sl));right:max(6px,var(--sr));transform:none;bottom:max(6px,var(--sb));justify-content:space-between;padding:4px;gap:0;border-radius:19px}
  #dock button{flex:1 1 0;width:auto;min-width:0;font-size:9px;gap:2px;padding:3px 0 2px;border-radius:13px;white-space:nowrap}
  #dock button .gi{width:33px;height:33px;font-size:15px;border-radius:11px}
  #dock .bdg{right:calc(50% - 24px)}

  .shd{padding:8px 10px 7px 11px}.shd .thumb{width:38px;height:38px}.shd .gi{width:34px;height:34px;font-size:17px}.shd h2{font-size:15.5px}
  .sbd{padding:10px 10px 14px}
  .zoomctl{bottom:calc(max(6px,var(--sb)) + 70px);right:max(8px,var(--sr));gap:5px}.zoomctl button{width:36px;height:36px;font-size:18px;border-radius:12px}
  #event{top:calc(max(8px,var(--st)) + 118px);width:calc(100% - 16px)}body.evon #toasts{top:calc(max(8px,var(--st)) + 180px)}
  #toasts{top:calc(max(8px,var(--st)) + 118px);width:calc(100% - 16px)}.toast{white-space:normal;max-width:100%}

  .grid3{gap:5px}.kv{padding:7px 7px}.kv b{font-size:13px}

@media (max-width:900px){ .pill.pat .s{display:none} }

<body>
<canvas id="cv"></canvas>
<div id="game">

  <div class="zoomctl"><button id="zIn">+</button><button id="zOut">−</button></div>
  <div id="sheet"><div class="shd" id="shHead"></div><div class="sbd" id="shBody"></div></div>

const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','UDc','DDc','TDc','QaDc','QiDc'];
function fmt(n,d=2){
  if(!isFinite(n)) return '∞'; if(n<0) return '−'+fmt(-n,d);
  if(n<1000){ if(n<10&&n%1) return n.toFixed(n<1?2:1); if(n<100&&n%1) return n.toFixed(1); return Math.floor(n)+''; }
  let e=Math.floor(Math.log10(n)/3), v=n/Math.pow(1000,e); if(v>=999.995){v/=1000;e++}
  if(e<SUF.length) return v.toFixed(v>=100?1:d)+' '+SUF[e];
  return n.toExponential(2).replace('+','');
}

function potFlow(){let v=0;const vm=valueMult();for(const r in RES){if(!S.sell[r])continue;const m=PRODUCER[r];if(!m||!S.m[m.id].lic)continue;
  let net=lineSpd(m)/m.t*yieldMult()*G.pf;for(const mm of MACH)if(mm.inp[r]&&S.m[mm.id].lic)net-=lineSpd(mm)/mm.t*G.pf*mm.inp[r];if(net>0)v+=net*RES[r].v*vm*priceF(r)}return v}
function fleetNeedLv(){const tgt=Math.max(G.dlvNeed,potFlow())*1.15;let n=1;while(fleetCapL(S.fleet+n)<tgt&&n<3000)n++;return n}
function bulk(b,g,n,k){return b*Math.pow(g,n)*(Math.pow(g,k)-1)/(g-1)}
function maxAff(b,g,n,money){const c=b*Math.pow(g,n);if(money<c)return 0;return Math.floor(Math.log(money*(g-1)/c+1)/Math.log(g))}
function buyPlan(b,g,n){const m=S.buy;if(m==='max'){const k=maxAff(b,g,n,S.money);return k>0?{k,c:bulk(b,g,n,k)}:{k:1,c:bulk(b,g,n,1)}}return{k:m,c:bulk(b,g,n,m)}}

function unitPlan(m,idx){const l=S.m[m.id].units[idx];return buyPlan(unitCost(m,idx,l),m.g,0)}

function linePlan(id,n,maxMoney){
  const m=MI[id],lv=S.m[id].units.slice();let cost=0,k=0;
  while(k<n&&k<5000){let bi=-1,bc=Infinity;for(let i=0;i<lv.length;i++){const c=unitCost(m,i,lv[i]);if(c<bc){bc=c;bi=i}}
    if(bi<0)break;if(maxMoney!==undefined&&cost+bc>maxMoney)break;cost+=bc;lv[bi]++;k++}
  return{k,cost,lv};
}
function lineBuyPlan(id){if(S.buy==='max'){const p=linePlan(id,5000,S.money);return p.k>0?p:linePlan(id,1)}return linePlan(id,S.buy)}

function simulate(dt,visual){
  const cap=powerCap(),dem=powerDem(),pf=dem<=0?1:Math.min(1,cap/dem);
  G.cap=cap;G.dem=dem;G.pf=pf;
  const sc=storeCap(),ym=yieldMult(),want={},need={};
  for(const m of MACH){const st=S.m[m.id];if(!st.lic||!st.units.length){want[m.id]=0;continue}
    const w=lineSpd(m)/m.t*dt*pf;want[m.id]=w;for(const r in m.inp)need[r]=(need[r]||0)+w*m.inp[r]}
  const ratio={};for(const r in need)ratio[r]=need[r]>0?Math.min(1,S.stock[r]/need[r]):1;
  const prod={},cons={};
  for(const m of MACH){const st=S.m[m.id],w=want[m.id];
    if(!w){G.eff[m.id]+=(0-G.eff[m.id])*Math.min(1,dt*3);G.why[m.id]=(st.lic&&st.units.length&&pf<=0)?'power':'idle';continue}
    let f=1,why=pf<.999?'power':'ok',lim=null;
    for(const r in m.inp){if(ratio[r]<f-1e-9){f=ratio[r];why='input';lim=r}}
    let c=w*f;
    if(!S.sell[m.out]){const space=Math.max(0,sc-S.stock[m.out]);if(c*ym>space){c=space/ym;why='full'}}
    else{const space=Math.max(0,(need[m.out]||0)*2/dt+Math.max(sc,w*ym*50)-S.stock[m.out]);if(c*ym>space){c=space/ym;why='truck'}}
    for(const r in m.inp){const q=c*m.inp[r];S.stock[r]=Math.max(0,S.stock[r]-q);cons[r]=(cons[r]||0)+q}
    S.stock[m.out]+=c*ym;prod[m.out]=(prod[m.out]||0)+c*ym;S.produced[m.out]+=c*ym;
    const full=lineSpd(m)/m.t*dt,e=full>0?c/full:0;
    G.eff[m.id]+=(e-G.eff[m.id])*Math.min(1,dt*3);G.why[m.id]=why;G.lim[m.id]=lim;
  }
  let earned=0;const vm=valueMult(),dmm=demandMult(),offer={};let E=0,flow=0;
  for(const r in RES){if(!S.sell[r])continue;const R=RES[r],f=Math.pow(1+S.sat[r]/(R.D*dmm*TAU),-.6)*rushF(r),q=S.stock[r]-(need[r]||0)*2/dt;
    flow+=Math.max(0,(prod[r]||0)-(cons[r]||0))*R.v*vm*f;if(q>1e-9){offer[r]=f;E+=q*R.v*vm*f}}
  const dcap=fleetCap()*dt,fr=E>dcap?dcap/E:1;   // les camions limitent ce qui part au client
  for(const r in RES){const R=RES[r];
    if(S.sell[r]){const reserve=(need[r]||0)*2/dt,q=(S.stock[r]-reserve)*fr;
      if(offer[r]!==undefined&&q>1e-9){const f=offer[r],e=q*R.v*vm*f;earned+=e;S.sat[r]+=q;S.stock[r]-=q;G.revAcc[r]+=e;if(visual)G.rev[r]+=(e/dt-G.rev[r])*Math.min(1,dt*.8)}
      else if(visual)G.rev[r]+=(0-G.rev[r])*Math.min(1,dt*.8);
    }else{if(S.stock[r]>sc)S.stock[r]=sc;if(visual)G.rev[r]+=(0-G.rev[r])*Math.min(1,dt*.8)}
    S.sat[r]*=Math.exp(-dt/TAU);
    if(visual){G.rate[r]+=((prod[r]||0)/dt-G.rate[r])*Math.min(1,dt*.8);G.cons[r]+=((cons[r]||0)/dt-G.cons[r])*Math.min(1,dt*.8)}
  }
  G.need=need;
  if(S.labLic)S.rp+=rpRate()*pf*dt;
  S.money+=earned;S.runEarned+=earned;S.lifetime+=earned;S.time+=dt;S.runTime+=dt;
  if(visual){const kk=Math.min(1,dt*.8);G.dlv+=(earned/dt-G.dlv)*kk;G.dlvNeed+=(flow/dt-G.dlvNeed)*kk;G.dlvBlk+=((fr<.98?1:0)-G.dlvBlk)*Math.min(1,dt*1.5)}
  if(visual){G.income+=(earned/dt-G.income)*Math.min(1,dt*.8);G.rps=S.labLic?rpRate()*pf:0;truckAcc+=earned}
  return earned;
}
function offlineProgress(sec){
  sec=Math.min(sec,offlineCap()); if(sec<60) return null;
  const eff=offlineEff(),m0=S.money,rp0=S.rp,steps=Math.min(3000,Math.max(20,Math.floor(sec))),dt=sec/steps;
  for(let i=0;i<steps;i++) simulate(dt,false);
  const gm=(S.money-m0)*(1-eff),gr=(S.rp-rp0)*(1-eff);
  S.money-=gm;S.runEarned-=gm;S.lifetime-=gm;S.rp-=gr;
  return {sec,money:S.money-m0,rp:S.rp-rp0};
}

function mileToast(m,idx,before,after){

  return false;
}
function upUnit(id,idx){
  const m=MI[id],st=S.m[id];if(st.units[idx]===undefined)return false;
  const p=unitPlan(m,idx);if(S.money<p.c)return false;
  const b=st.units[idx];S.money-=p.c;st.units[idx]+=p.k;S.ups++;
  if(!mileToast(m,idx,b,st.units[idx]))sfx('buy');

  const why=G.why[m.id],o=S.m[m.id];
  if(why==='power'||G.pf<.999){const def=G.dem-G.cap,g=bestGen(),n=Math.max(1,Math.ceil(def/g.out)),c=bulk(g.cost,g.g,S.gens[g.id],n);
    return{cls:'bad',t:`Pas assez d'électricité ! Toute l'usine tourne à ${Math.round(G.pf*100)}%.`,s:`Il manque ${fmt(def)} MW.`,btn:{a:'fixgen',id:g.id,n,label:`${g.n} +${n} niveaux · ${$t(c)}`,dis:S.money<c}}}
  if(why==='input'&&G.lim[m.id]){const r=G.lim[m.id],pm=PRODUCER[r],need=lineSpd(m)/m.t*G.pf*m.inp[r];
    let used=0;for(const mm of MACH){if(mm.inp[r]&&S.m[mm.id].lic)used+=lineSpd(mm)/mm.t*G.pf*mm.inp[r]}
    const def=Math.max(0,used-G.rate[r]);
    if(!pm||!S.m[pm.id].lic)return{cls:'warn',t:`Pas assez de « ${RES[r].n} ».`,s:'Construis la ligne qui le produit.'};
    const tl=S.m[pm.id].units.reduce((a,b)=>a+b,0),perLvl=lineSpd(pm)/pm.t*yieldMult()*G.pf/Math.max(1,tl);
    const n=Math.max(1,Math.ceil(def/Math.max(1e-9,perLvl)*.6)),plan=linePlan(pm.id,n);
    return{cls:G.eff[m.id]<.3?'bad':'warn',t:`Pas assez de « ${RES[r].n} » : il en faut ${fmt(need)}/s, l'usine n'en produit que ${fmt(G.rate[r])}/s.`,s:`Améliore la ligne « ${pm.n} » (environ ${n} niveaux).`,btn:{a:'fixline',id:pm.id,n,label:`${pm.n} +${n} niveaux · ${$t(plan.cost)}`,dis:S.money<plan.cost}}}
  if(why==='truck'||(S.sell[m.out]&&G.dlvBlk>.5)){const n=fleetNeedLv(),c=bulk(FLEET.cost,FLEET.g,S.fleet-1,n);
    return{cls:why==='truck'?'bad':'warn',t:why==='truck'?'Le quai déborde : les camions n\'arrivent plus à tout livrer, la ligne ralentit.':'Les camions sont saturés : une partie des ventes attend sur le quai.',s:`Livraisons : ${$t(G.dlv)}/s sur ${$t(fleetCap())}/s possibles.`,btn:{a:'fixfleet',id:'fleet',n,label:`Camions +${n} niveau${n>1?'x':''} · ${$t(c)}`,dis:S.money<c}}}
  if(why==='full')return{cls:'warn',t:'Stock plein : la vente est coupée.',s:'Active « Vendre le surplus » ou livre le stock au mégaprojet.'};
  if(why==='idle')return{cls:'idle',t:'À l\'arrêt.',s:''};
  const f=priceF(m.out);
  if(S.sell[m.out]&&f<.55)return{cls:'warn',t:`Le marché « ${RES[m.out].n} » sature (prix ×${f.toFixed(2)}).`,s:'Transforme-le en produit plus cher, ou recherche « Marketing ».'};
  return{cls:'ok',t:'✓ Tout roule ! Cette ligne tourne à plein régime.',s:'Améliore tes machines pour produire davantage.'};
}

function modal(html,cls){const m=$('#modal');m.innerHTML=`<div class="mbox ${cls||''}">${html}</div>`;m.classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&$('.orient')){closeModal();const f=afterOrient;afterOrient=null;f&&f();return}if(e.target.id==='modal'&&!$('.tuto'))closeModal();const b=e.target.closest('[data-m]');if(!b)return;const a=b.dataset.m;
  if(a==='orient'){closeModal();const f=afterOrient;afterOrient=null;f&&f();return}
  if(a==='close')closeModal();if(a==='prestige'){closeModal();prestige()}
  if(a==='market'){closeModal();openSheet('market')}
  if(a==='gotech'){closeModal();if(lastTech)TECHU(lastTech).go()}
  if(a==='next')showTuto(tutoI+1);if(a==='prev')showTuto(tutoI-1);if(a==='skip'||a==='end'){S.tuto=true;closeModal();save()}
  if(a==='wipe'){['ferrum_save_v3','ferrum_save_v2','ferrum_save_v1'].forEach(k=>localStorage.removeItem(k));S=newState();closeModal();closeSheet();belts={};rebuildSigns();fitCam(true);save();setTimeout(()=>showTuto(0),300)}
  if(a==='import'){try{const d=JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim()))));localStorage.setItem(KEY,JSON.stringify(d));load();closeModal();closeSheet();rebuildSigns();fitCam(true);toast('Sauvegarde importée','#22c55e','✓')}catch(err){toast('Code invalide','#ef4444','✕')}}

let edgeAcc=1.5;const EDGE=document.createElement('canvas');EDGE.width=EDGE.height=1;const EDX=EDGE.getContext('2d',{willReadFrequently:true});
function edgeCol(y){try{EDX.drawImage(cv,Math.floor(cv.width*.5),y,1,1,0,0,1,1);const d=EDX.getImageData(0,0,1,1).data;return`rgb(${d[0]},${d[1]},${d[2]})`}catch(e){return null}}
function matchEdges(){const b=edgeCol(cv.height-2),t=edgeCol(1);if(b){document.documentElement.style.background=b;document.body.style.background=b}
  let m=document.querySelector('meta[name=theme-color]');if(!m){m=document.createElement('meta');m.name='theme-color';document.head.appendChild(m)}if(t)m.content=t}
let lastT=performance.now(),simAcc=0,uiAcc=0,saveAcc=0,lastRows=-1;
function frame(now){
  let dt=(now-lastT)/1000;lastT=now;
  if(cv.clientWidth!==W||cv.clientHeight!==H){resize();fitCam(true)}
  if(dt>5){const r=offlineProgress(dt);if(r)showOffline(r);dt=0}
  dt=Math.min(dt,.25);
  simAcc+=dt;while(simAcc>=.1){simulate(.1,true);simAcc-=.1}
  const vr=visibleRows()*10+(S.labLic?1:0);if(vr!==lastRows){if(lastRows>=0)rebuildSigns();lastRows=vr}
  updFleet(dt);updCrate(dt);updWorkers(dt);updEvents(dt);
  uiAcc+=dt;if(uiAcc>.2){updTips(uiAcc);uiAcc=0;checkAch();updEventCard();syncWorkers();checkTechReady();updHUD();updSigns();if(sheetOpen()){if(sheetDirty)buildSheet();else updSheet()}}
  saveAcc+=dt;if(saveAcc>10){saveAcc=0;save()}
  edgeAcc+=dt;if(edgeAcc>1.5){edgeAcc=0;matchEdges()}
  render(now/1000,dt);posSigns();
  requestAnimationFrame(frame);
}
