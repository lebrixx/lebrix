<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CHRONOPHASE RUSH</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
    --a:#7BC4E4; --b:#E58FB8; --gold:#E3C58D; --danger:#E8705F;
    --ink:#EEF0F5; --mute:rgba(238,240,245,.55); --line:rgba(255,255,255,.12);
    --glass:rgba(14,16,24,.52); --blur:blur(14px) saturate(140%);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#07080d;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:'Sora',system-ui,-apple-system,sans-serif;color:var(--ink);position:fixed;inset:0;-webkit-font-smoothing:antialiased}
  canvas{display:block}
  b{font-weight:600}
  .glass{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line)}
  #hud{position:fixed;inset:0;pointer-events:none}
  #tl{position:absolute;left:calc(20px + var(--sl));top:calc(16px + var(--st))}
  #dist{font-size:34px;font-weight:200;letter-spacing:-.5px;line-height:1;font-variant-numeric:tabular-nums}
  #dist.bump{animation:bump .5s ease}
  @keyframes bump{30%{transform:scale(1.25);color:var(--gold)}}
  #dist{transform-origin:left center}
  #dist span{font-size:14px;font-weight:300;color:var(--mute);margin-left:4px}
  #best{font-size:10px;letter-spacing:.22em;color:var(--mute);margin-top:7px}
  #tr{position:absolute;right:calc(20px + var(--sr));top:calc(18px + var(--st));width:170px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  .lbl{font-size:10px;letter-spacing:.24em;color:var(--mute);display:flex;justify-content:space-between;width:100%}
  .lbl i{font-style:normal;color:var(--gold)}
  #bar{height:4px;width:100%;background:rgba(255,255,255,.09);border-radius:4px;overflow:hidden;margin-top:-4px}
  #fill{height:100%;width:100%;background:linear-gradient(90deg,#b8945a,var(--gold) 70%,#f6e6c4);border-radius:4px;transition:width .1s linear}
  #pill{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 10px;border-radius:20px;font-size:11px;letter-spacing:.2em;font-weight:400}
  #pill i{width:8px;height:8px;border-radius:50%;background:var(--a);transition:background .25s}
  #hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(17% + var(--st));width:min(560px,calc(100% - 32px));text-align:center;font-size:14px;font-weight:300;line-height:1.55;padding:12px 18px;border-radius:16px;display:none}
  #warn{position:absolute;left:0;right:0;top:calc(31% + var(--st));text-align:center;display:none}
  #warn span{white-space:nowrap;display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:24px;font-size:13px;letter-spacing:.14em;font-weight:400;animation:breathe .7s ease-in-out infinite alternate}
  #warn span i{width:9px;height:9px;border-radius:50%}
  @keyframes breathe{from{opacity:.7}to{opacity:1}}
  #phToast{position:absolute;left:0;right:0;top:calc(46% + var(--st));text-align:center;font-size:clamp(22px,7vw,34px);font-weight:200;letter-spacing:.5em;opacity:0;transition:opacity .5s ease, letter-spacing .5s ease}
  #phToast.show{opacity:.95;letter-spacing:.35em;transition:none}
  #pauseBtn{position:absolute;left:50%;transform:translateX(-50%);top:calc(12px + var(--st));width:44px;height:44px;cursor:pointer;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:11px;letter-spacing:1px;pointer-events:auto;color:var(--ink)}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 120% 90% at 50% 45%,transparent 55%,rgba(3,4,8,.55) 100%);transition:box-shadow .35s ease}
  #scan{position:fixed;inset:0;pointer-events:none;display:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1px,transparent 1px 3px),linear-gradient(rgba(227,197,141,.07),rgba(227,197,141,.03))}
  #rwTxt{position:absolute;left:0;right:0;top:28%;text-align:center;font-size:12px;letter-spacing:.5em;font-weight:300;color:var(--gold)}
  #rwTxt b{display:block;font-size:30px;font-weight:200;letter-spacing:.2em;margin-bottom:6px}
  @keyframes soft{from{transform:scale(1)}to{transform:scale(1.07)}}
  #overlay{transition:opacity .3s ease;position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:calc(20px + var(--st)) 18px calc(20px + var(--sb))}
  .title{font-size:clamp(26px,7.6vw,62px);font-weight:200;letter-spacing:.2em;margin:0 0 0 .2em;white-space:nowrap;line-height:1;background:linear-gradient(180deg,#fff 30%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  .kicker{font-size:11px;letter-spacing:.6em;color:var(--gold);margin:14px 0 6px .6em}
  .tag{font-size:13px;font-weight:300;color:var(--mute);margin-bottom:26px}
  .card{width:min(420px,100%);border-radius:22px;padding:18px 20px;margin-bottom:14px;text-align:left}
  .card h3{margin:0 0 12px;font-size:10px;letter-spacing:.3em;font-weight:400;color:var(--mute)}
  .rowk{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:7px 0;border-top:1px solid rgba(255,255,255,.06);font-size:13px;font-weight:300}
  .rowk:first-of-type{border-top:0}
  .rowk kbd{font-family:inherit;font-size:11px;letter-spacing:.08em;color:var(--ink);padding:4px 9px;border:1px solid var(--line);border-radius:8px;white-space:nowrap;background:rgba(255,255,255,.03)}
  .rule{font-size:13px;font-weight:300;line-height:1.65;color:rgba(238,240,245,.82)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 3px 1px;vertical-align:middle}
  .cta{pointer-events:auto;font:inherit;font-size:13px;font-weight:600;letter-spacing:.3em;color:#14110b;background:linear-gradient(180deg,#f3e2bd,var(--gold));border:0;border-radius:40px;padding:17px 44px 17px calc(44px + .3em);margin-top:10px;box-shadow:0 10px 30px rgba(227,197,141,.18),inset 0 1px 0 rgba(255,255,255,.6);cursor:pointer}
  .cta:active{transform:scale(.97)}
  .muted{font-size:11px;letter-spacing:.2em;color:var(--mute);margin-top:16px}
  .scrim{position:absolute;inset:0;background:rgba(5,6,10,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .big{font-size:clamp(56px,18vw,88px);font-weight:200;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
  .big span{font-size:.25em;color:var(--mute);letter-spacing:0;margin-left:6px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;width:min(380px,100%);border-radius:18px;margin:24px 0 8px;overflow:hidden}
  .stats div{padding:14px 6px;font-size:18px;font-weight:300}
  .stats div+div{border-left:1px solid var(--line)}
  .stats small{display:block;font-size:9px;letter-spacing:.22em;color:var(--mute);margin-top:4px}
  .badge{display:inline-block;font-size:10px;letter-spacing:.3em;color:#14110b;background:var(--gold);padding:6px 12px 6px calc(12px + .3em);border-radius:20px;margin-top:14px}
  .broken{font-size:12px;letter-spacing:.5em;color:var(--danger);font-weight:400}
  /* contrôles tactiles : 2 boutons à gauche, un peu sous le milieu */
  #pad{position:fixed;left:calc(16px + var(--sl));top:56%;display:none;flex-direction:column;gap:14px;pointer-events:none}
  .b{cursor:pointer;pointer-events:auto;width:70px;height:70px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:20px;color:var(--ink);transition:transform .08s ease,background .15s,border-color .25s,color .25s}
  .b small{font-size:8px;letter-spacing:.2em;color:var(--mute)}
  .b.down{transform:scale(.92);background:rgba(255,255,255,.14)}
  #bRw{color:var(--gold)}
  .rwl{text-align:center;line-height:1.25}
  .rwl span{display:block;font-size:6.5px;letter-spacing:.14em;opacity:.85}
  #well{position:absolute;left:0;right:0;top:calc(17% + var(--st));text-align:center;display:none}
  #well span{display:inline-block;padding:10px 18px;border-radius:18px;font-size:11px;letter-spacing:.2em;line-height:1.6}
  #well b{display:block;font-size:18px;font-weight:300;letter-spacing:.3em}
  #warp{position:fixed;inset:0;pointer-events:none;opacity:0;overflow:hidden}
  #warp i{position:absolute;left:50%;top:50%;width:120vmax;height:120vmax;margin:-60vmax 0 0 -60vmax;border-radius:50%;
    background:repeating-conic-gradient(from 0deg,rgba(255,244,220,.0) 0 8deg,rgba(255,236,200,.55) 8deg 11deg),radial-gradient(circle,rgba(255,252,240,1) 0,rgba(243,226,189,.9) 12%,rgba(227,197,141,.35) 32%,rgba(20,16,10,.0) 62%)}
  #warp b{position:absolute;left:50%;top:50%;width:40vmin;height:40vmin;margin:-20vmin 0 0 -20vmin;border-radius:50%;border:3px solid rgba(255,240,210,.95);box-shadow:0 0 30px rgba(243,226,189,.9),inset 0 0 30px rgba(243,226,189,.7)}
  #warp.go{animation:warpO .75s ease-out}
  #warp.go i{animation:warpS .75s cubic-bezier(.3,.6,.3,1)}
  #warp.go b{animation:warpR .75s ease-out}
  @keyframes warpO{0%{opacity:0}18%{opacity:1}55%{opacity:1}100%{opacity:0}}
  @keyframes warpS{0%{transform:scale(.15) rotate(0)}100%{transform:scale(1.25) rotate(160deg)}}
  @keyframes warpR{0%{transform:scale(.2);opacity:1}100%{transform:scale(3.2);opacity:0}}
  #flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 55%,rgba(255,236,205,.85),rgba(227,197,141,.25) 50%,transparent 80%);opacity:0}

  /* ---- bouton tutoriel (à l'opposé de TEMPS) + fiches ---- */
  #tutoBtn{position:fixed;right:calc(16px + var(--sr));top:56%;display:none;color:#cfe3f1;z-index:30}
  #tutoBtn .q{font-size:24px;font-weight:300;line-height:1}
  .callout.r{left:auto;right:calc(16px + var(--sr));text-align:right;color:#a9cfe4}
  .callout.r::after{left:auto;right:34px;background:linear-gradient(#a9cfe4,transparent)}
  #tuto{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:calc(18px + var(--st)) 16px calc(18px + var(--sb))}
  #tuto.on{display:flex}
  #tuto .bg{position:absolute;inset:0;background:rgba(4,5,9,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fade .3s ease}
  #tuto .card{position:relative;width:min(370px,100%);border-radius:26px;padding:22px 20px 18px;text-align:center;touch-action:pan-y;animation:rise .45s ease both;
    background:linear-gradient(180deg,rgba(26,29,42,.92),rgba(13,15,22,.94));border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06)}
  #tuto .x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mute);cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.03)}
  #tuto .step{font-size:10px;letter-spacing:.32em;color:var(--gold);margin:2px 0 8px .32em}
  #tuto h3{margin:0 0 12px;padding:0 32px;font-size:clamp(15px,4.4vw,19px);font-weight:300;letter-spacing:.2em}
  #tuto .ill{height:150px;display:flex;align-items:center;justify-content:center;margin:0 -6px 12px;border-radius:18px;background:radial-gradient(ellipse at 50% 60%,rgba(255,255,255,.05),transparent 70%)}
  #tuto .ill svg{width:100%;height:100%}
  #tuto p{margin:0 auto;max-width:300px;font-size:13px;line-height:1.6;color:rgba(238,240,245,.82);min-height:84px}
  #tuto p b{color:#fff}
  #tuto .slide{animation:fade .35s ease}
  #tuto .dots{display:flex;justify-content:center;gap:7px;margin:14px 0 14px}
  #tuto .dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);transition:all .25s}
  #tuto .dots i.on{width:20px;background:var(--gold)}
  #tuto .nav{display:flex;gap:10px}
  #tuto .nav button{flex:1;margin:0;padding:14px 0 14px .26em;font-size:11px;letter-spacing:.26em}
  #tuto .nav .ghost{width:auto}
  #tuto .nav .cta{padding:14px 0 14px .26em}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @media (max-height:600px){ #tuto .ill{height:110px} #tuto p{min-height:0;font-size:12px} }
  @media (max-height:520px){ #tutoBtn{top:42%} }
  #hud .glass,#pad .glass,#tutoBtn{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(14,16,24,.74)}
  #tapHint .t{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(9,10,17,.72)!important}

  /* indication unique de l'écran d'accueil */
  .menu .tapLine{position:absolute;left:0;right:0;top:31%;text-align:center;animation:rise .8s ease both .4s}
  .tapLine span{position:relative;display:inline-flex;align-items:center;gap:12px;padding:13px 18px;border-radius:40px;font-size:clamp(10px,3vw,13px);letter-spacing:.18em;font-weight:600;color:#fbf9ff;background:rgba(9,10,17,.6);
    text-shadow:0 0 4px rgba(255,255,255,.5),0 0 14px rgba(123,196,228,.45);box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 22px rgba(123,196,228,.15),0 0 40px rgba(229,143,184,.1)}
  .tapLine span::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:linear-gradient(90deg,var(--a),rgba(255,255,255,.8) 50%,var(--b));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .tapLine u{text-decoration:none;white-space:nowrap;padding-left:.18em}
  .tapLine b{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tapLine i{width:8px;height:8px;border-radius:50%;box-shadow:0 0 10px currentColor;flex:none}
  /* bouton SKIN */
  .skinBtn{pointer-events:auto;display:flex;align-items:center;gap:9px;padding:9px 14px 9px 9px;border-radius:30px;margin-bottom:16px;cursor:pointer;font-size:10px;letter-spacing:.24em;color:var(--mute)}
  .skinBtn i{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 0 12px rgba(227,197,141,.25)}
  .skinBtn b{color:var(--gold);font-weight:600;letter-spacing:.24em}
  .skinBtn:active{transform:scale(.97)}
  /* sélecteur de skins (feuille en bas, le perso reste visible au-dessus) */
  #skins{position:fixed;inset:0;z-index:40;display:none}
  #skins.on{display:block}
  #skins .bg{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,5,9,0) 30%,rgba(4,5,9,.75) 60%);animation:fade .3s ease}
  #skins .sheet{position:absolute;left:12px;right:12px;bottom:calc(14px + var(--sb));border-radius:26px;padding:18px 14px 14px;text-align:center;animation:rise .4s ease both;
    background:linear-gradient(180deg,rgba(26,29,42,.94),rgba(13,15,22,.96));border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 80px rgba(0,0,0,.55)}
  #skins .kicker{margin:0 0 4px .6em}
  #skins h3{margin:0 0 14px;font-size:18px;font-weight:300;letter-spacing:.24em}
  #skins .row{display:flex;gap:6px}
  .sk{flex:1;border-radius:18px;padding:10px 4px 10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);cursor:pointer;transition:border-color .2s,background .2s}
  .sk svg{display:block;margin:0 auto;width:50px;height:64px}
  .sk b{display:block;font-size:10px;letter-spacing:.14em;margin-top:6px;padding-left:.14em}
  .sk small{display:block;font-size:8px;color:var(--mute);margin-top:3px;letter-spacing:.02em;min-height:3.9em;line-height:1.3;padding:0 2px}
  .sk em{display:inline-block;margin-top:6px;font-style:normal;font-size:7px;letter-spacing:.18em;color:var(--mute);padding:4px 8px 4px calc(8px + .24em);border-radius:10px;border:1px solid rgba(255,255,255,.1)}
  .sk.on{border-color:rgba(227,197,141,.75);background:rgba(227,197,141,.07)}
  .sk.on em{color:#14110b;background:var(--gold);border-color:var(--gold)}
  #skins .cta{width:100%;margin-top:14px;padding:15px 0 15px .3em}
  #tapHint{position:absolute;left:0;right:0;top:calc(36% + var(--st));text-align:center;pointer-events:none;opacity:0;transition:opacity .6s ease}
  #tapHint.on{opacity:1}
  #tapHint .tap{position:relative;width:58px;height:58px;margin:0 auto 14px}
  #tapHint .tap::before{content:'';position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 18px rgba(255,255,255,.9)}
  #tapHint .tap i{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.9);animation:ripple 1.6s cubic-bezier(.2,.6,.3,1) infinite}
  #tapHint .tap i+i{animation-delay:.8s}
  @keyframes ripple{0%{transform:scale(.25);opacity:1}100%{transform:scale(1.35);opacity:0}}
  #tapHint .t{position:relative;display:inline-block;font-size:clamp(17px,5.2vw,22px);letter-spacing:.3em;font-weight:600;color:#fbf9ff;padding:14px 26px 14px calc(26px + .3em);border-radius:40px;background:rgba(9,10,17,.58);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    text-shadow:0 0 4px rgba(255,255,255,.6),0 0 14px rgba(123,196,228,.55),0 0 30px rgba(229,143,184,.35);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.45),0 0 22px rgba(123,196,228,.2),0 0 44px rgba(229,143,184,.14)}
  #tapHint .t::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:linear-gradient(90deg,var(--a),rgba(255,255,255,.85) 50%,var(--b));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;filter:drop-shadow(0 0 5px rgba(255,255,255,.4))}
  #tapHint .t b{font-weight:700;background:linear-gradient(90deg,#a9dcf2,var(--a) 35%,var(--b) 65%,#f4bcd6);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 6px rgba(229,143,184,.45)) drop-shadow(0 0 10px rgba(123,196,228,.35))}
  #tapHint .t em{font-style:normal;opacity:.55;margin:0 .1em}
  #tapHint.on .t{animation:neonIn 1s ease-out both,neonBreath 2.8s ease-in-out 1s infinite}
  @keyframes neonIn{0%{opacity:0;transform:scale(.96)}12%{opacity:.85}17%{opacity:.25}24%{opacity:1}29%{opacity:.6}36%,100%{opacity:1;transform:none}}
  @keyframes neonBreath{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.45),0 0 22px rgba(123,196,228,.2),0 0 44px rgba(229,143,184,.14)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 10px 30px rgba(0,0,0,.45),0 0 30px rgba(123,196,228,.34),0 0 60px rgba(229,143,184,.26)}}
  #tapHint .d{display:flex;justify-content:center;gap:8px;margin-top:12px}
  #tapHint .d span{width:9px;height:9px;border-radius:50%;box-shadow:0 0 10px currentColor}
  @keyframes softc{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-50%) scale(1.05)}}
  @media (max-width:520px){ #dist{font-size:28px} #tr{width:128px} #hint{font-size:13px} .card{padding:14px 16px} .rowk{font-size:12px} }
  /* menu pause */
  .pmenu{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;width:min(300px,86vw)}
  .pstats{display:grid;grid-template-columns:1fr 1fr;width:100%;border-radius:18px;margin:14px 0 8px;overflow:hidden}
  .pstats div{padding:14px 6px;font-size:20px;font-weight:300}.pstats div+div{border-left:1px solid var(--line)}
  .pstats small{display:block;font-size:9px;letter-spacing:.22em;color:var(--mute);margin-top:4px}
  .pmenu .cta{width:100%;margin-top:4px}
  .ghost{pointer-events:auto;width:100%;font:inherit;font-size:12px;font-weight:600;letter-spacing:.28em;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:40px;padding:15px 0 15px .28em;cursor:pointer}
  .ghost:active{transform:scale(.97)}
  /* écran d'accueil */

function au(){ if (AC){ if (AC.state==='suspended') AC.resume(); return; } try{ AC = new (window.AudioContext||window.webkitAudioContext)(); master = AC.createGain(); master.gain.value=.5; master.connect(AC.destination);}catch(e){} }
function tone(f,d,type='square',v=.1,f2=null,delay=0){ if(!AC)return; const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.02); }
function noise(d,v=.2){ if(!AC)return; const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),ch=b.getChannelData(0); for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length); const s=AC.createBufferSource(),g=AC.createGain(); g.gain.value=v; s.buffer=b; s.connect(g); g.connect(master); s.start(); }

  die(){ noise(.45,.3); tone(200,.5,'sawtooth',.12,40); }, resume(){ tone(300,.25,'sine',.1,900); }
};
function rewindSound(on){
  if (!AC) return;
  if (on && !rwOsc){ rwOsc=AC.createOscillator(); const g=AC.createGain(), lfo=AC.createOscillator(), lg=AC.createGain(); rwOsc.type='sawtooth'; rwOsc.frequency.value=170; lfo.frequency.value=14; lg.gain.value=60; lfo.connect(lg); lg.connect(rwOsc.frequency); g.gain.value=.05; rwOsc.connect(g); g.connect(master); rwOsc.start(); lfo.start(); rwOsc._l=lfo; }
  else if (!on && rwOsc){ rwOsc.stop(); rwOsc._l.stop(); rwOsc=null; }
}

// ============ GÉNÉRATION ============
function addObs(o){
  o.phase ??= null; o.v ??= 0; o.t0 = gt;
  const g = new THREE.Group(), w=o.hw*2, h=o.y1-o.y0, d=o.len;
  const add = (mat, geo=BOX, parent=g) => { const m = geo===EDGES ? new THREE.LineSegments(EDGES, mat) : new THREE.Mesh(geo, mat); m.scale.set(w,h,d); parent.add(m); return m; };
  if (o.type === 'pwall'){
    const c = o.phase, fr = .16;
    const frame = (mat, parent, t) => { for (const [sx,sy,px,py] of [[t,h,-w/2,0],[t,h,w/2,0],[w+t,t,0,h/2],[w+t,t*.7,0,-h/2+t*.35]]){ const m = new THREE.Mesh(BOX, mat); m.scale.set(sx,sy,d*.9); m.position.set(px,py,0); parent.add(m); } };
    o.solid = new THREE.Group(); g.add(o.solid);
    const f = new THREE.Mesh(BOX, matField[c]); f.scale.set(w-fr, h-fr, .12); o.solid.add(f);
    frame(matFrame[c], o.solid, fr);
    const gl = new THREE.Mesh(WALLGLOW_G, matFloorGlow[c]); gl.scale.x = w; gl.position.set(0, -h/2 + .03, 2.6); o.solid.add(gl);
    o.ghost = new THREE.Group(); g.add(o.ghost);
    add(matGhostFill[c], BOX, o.ghost); frame(matFrameDim[c], o.ghost, .07);
  }
  else if (o.phase !== null){
    o.solid = new THREE.Group(); g.add(o.solid); add(matSolid[o.phase], BOX, o.solid); add(matEdgeOn[o.phase], EDGES, o.solid);
    o.ghost = new THREE.Group(); g.add(o.ghost); add(matGhost[o.phase], EDGES, o.ghost); add(matGhostFill[o.phase], BOX, o.ghost);
  }
  else if (o.type==='block'){ buildVan(g, d); }
  else if (o.type==='gate'){ // portique doré du carrefour
    for (const px of [-3.95, 3.95]){ const p = new THREE.Mesh(BOX, matChamp); p.scale.set(.18, h, .18); p.position.x = px; g.add(p); }
    const top = new THREE.Mesh(BOX, matChamp); top.scale.set(8.1,.18,.18); top.position.y = h/2; g.add(top);
    const ring = new THREE.Mesh(GATE_RING_G, matChamp); ring.position.y = h/2 + 1.1; g.add(ring);
    const hand = new THREE.Mesh(BOX, matChamp); hand.scale.set(.06,.8,.06); hand.position.set(0, h/2+1.4, 0); g.add(hand);
  }
  else if (o.type==='ramp'){ // tremplin doré incliné
    const slope = new THREE.Group(); g.add(slope); slope.rotation.x = Math.atan2(h, d);
    const plate = new THREE.Mesh(BOX, matChamp); plate.scale.set(w, .18, Math.hypot(d,h)); slope.add(plate);
    for (let i=0;i<5;i++){ const b = new THREE.Mesh(BOX, matLightBar); b.scale.set(w*.8,.04,.12); b.position.set(0,.12,(i-2)*Math.hypot(d,h)/5); slope.add(b); }
    const beam = new THREE.Mesh(BEAM_G, matBeam); beam.position.set(0, 5, -d/2); g.add(beam);
  }
  else if (o.type==='deadend'){ g.add(new THREE.Mesh(BOX, [matDark,matDark,matDark,matDark,matDead,matDark])); g.children[0].scale.set(w,h,d); add(matEdgeWarn, EDGES); }
  else if (o.type==='tport'){ // portail d'entrée (identique sur les 3 voies)
    const ring = new THREE.Mesh(TPORT_RING_G, matChamp); g.add(ring);
    const disc = new THREE.Mesh(TPORT_DISC_G, matSwirl); g.add(disc); o.spin = disc;
    const base = new THREE.Mesh(BOX, matDark); base.scale.set(2.5,.22,.7); base.position.y = -h/2 + .11; g.add(base);
  }
  else if (o.type==='shaft'){ // les 3 puits : murs profonds + bandes lumineuses pour sentir la chute
    for (const wx of [-3.9, -1.3, 1.3, 3.9]){
      const inner = Math.abs(wx) < 2;
      const wm = new THREE.Mesh(BOX, inner ? matWellGlass : matWellWall); wm.scale.set(inner ? .06 : .2, h, d); wm.position.x = wx; g.add(wm);
      if (!inner) for (let y = -3; y > -WELL_DEPTH + 1; y -= 6){ const st = new THREE.Mesh(BOX, matWellStrip); st.scale.set(.26, .06, d); st.position.set(wx, y + h/2, 0); g.add(st); }
      if (inner){ const top = new THREE.Mesh(BOX, matLightBar); top.scale.set(.1, .06, d); top.position.set(wx, h/2 - .03, 0); g.add(top); } // séparation bien visible
    }
    for (const zz of [-d/2, d/2]){ // murs du fond et de l'entrée

  }

  }

    for (const px of [-3.95, 3.95]){ const p = new THREE.Mesh(BOX, matChamp); p.scale.set(.14, 4.9, .14); p.position.set(px, -1.95, 0); g.add(p); }
  }
  else if (o.type==='wexit'){ // portail de sortie sur la route : on en ressort
    const ring = new THREE.Mesh(TPORT_RING_G, matChamp); g.add(ring);

  }
  else if (o.type==='wbottom'){ // fond d'un puits piégé : lueur rouge

    const gl = new THREE.Mesh(PITGLOW_G, matPitGlow); gl.scale.z = d/TILE; gl.position.y = .1; g.add(gl);
    const mz = -(o.mark - (o.s + d/2));
    const x = new THREE.Mesh(WDISC_G, matDeadX); x.scale.setScalar(1.6); x.position.set(0, .15, mz); g.add(x);                      // grand X rouge
    const col = new THREE.Mesh(BEAM_G, matBeamRed); col.scale.set(1.55, 1.3, 1.55); col.position.set(0, 6.5, mz); g.add(col);    // colonne rouge
    for (let y = 3; y <= 12; y += 4.5){ const r2 = new THREE.Mesh(WRING_G, matWellStripRed); r2.scale.set(.85, 1, .85); r2.position.set(0, y, mz); g.add(r2); }
  }
  else if (o.type==='divider'){ // barrière basse entre les couloirs : poteaux + 2 lisses + bandeau lumineux
    const piece = (mat, sx,sy,sz, y,z=0) => { const m = new THREE.Mesh(BOX, mat); m.scale.set(sx,sy,sz); m.position.set(0,y,z); g.add(m); return m; };
    for (let z = -d/2 + .6; z <= d/2 - .4; z += 2.5){ piece(matPole, .14, h, .14, 0, z); piece(matAccent, .16, .08, .16, h/2 - .25, z); }

    piece(matLightBar, .07, .05, d, h/2 + .03);       // bandeau corail lumineux

  else { // barrière : panneau signalétique sur la face qui regarde le joueur
    if (o.type==='high'){ // barre à hauteur de tête : on passe dessous en glissant
      const m = new THREE.Mesh(BOX, [matMetal, matMetal, matMetal, matMetal, matDuck, matMetal]); m.scale.set(w, h, d); g.add(m);
      add(matEdgeWarn, EDGES);
      const lb = new THREE.Mesh(BOX, matLightBar); lb.scale.set(w*.98, .07, d*1.1); lb.position.set(0, -h/2 - .03, 0); g.add(lb);
      for (const px of [-o.hw-.04, o.hw+.04]){
        const p = new THREE.Mesh(BOX, matDark); p.scale.set(.12, o.y1 + .2, .12); p.position.set(px, -(o.y0+o.y1)/2 + (o.y1+.2)/2, 0); g.add(p);
        const r = new THREE.Mesh(BOX, matAccent); r.scale.set(.13, .06, .13); r.position.set(px, -h/2 - .03, 0); g.add(r);
      }
    } else { // barrière basse : panneau ▲ + barre lumineuse sur le dessus
      const m = new THREE.Mesh(BOX, [matMetal, matMetal, matMetal, matMetal, matSignUp, matMetal]); m.scale.set(w, h, d); g.add(m);
      add(matEdgeWarn, EDGES);
      const lb = new THREE.Mesh(BOX, matLightBar); lb.scale.set(w*.98, .06, d*1.1); lb.position.set(0, h/2 + .02, 0); g.add(lb);

  castAll(g); scene.add(g); o.mesh = g; objs.push(o); return o;
}
function laneObs(type, l, s){
  const x = LANES[l];
  if (type==='low')   return addObs({type, x, hw:1.1, s, len:.5, y0:0, y1:1.0});
  if (type==='high')  return addObs({type, x, hw:1.1, s, len:.5, y0:1.35, y1:3.3});
  if (type==='block') return addObs({type, x, hw:1.15, s, len:9, y0:0, y1:3.4});
}
function phaseWall(x, hw, s, c){ return addObs({type:'pwall', x, hw, s, len:.7, y0:0, y1:4.6, phase:c}); }
function addShard(x, y, s){ const m = new THREE.Mesh(SHARD_G, matShard); scene.add(m); shards.push({x,y,s,taken:false,mesh:m}); }
function shardLine(l, s, n, step=3, arc=false){ for (let i=0;i<n;i++){ const f=(i+.5)/n; addShard(LANES[l], 1 + (arc? Math.sin(f*Math.PI)*1.7 : 0), s + i*step); } }
let genTut = false;
function hint(s, text, btn, sw){ if (genTut) return; hints.push({s, text, touch:[btn||text, sw||btn||text]}); }
function holeRow(s, len, bridges){ // bridges[lane] = null (trou) | 0 | 1
  const i0 = Math.ceil(s/TILE), n = Math.round(len/TILE);
  for (let l=0;l<3;l++) for (let i=i0;i<i0+n;i++) holes.set(l+':'+i, {phase:bridges[l]});
  return (i0+n)*TILE;
}

function genChunk(){
  const d = Math.min(1, dist/7000), sp = speed;
  genS += tut < 6 ? sp*1.5 : Math.max(18, sp*(.92 - .3*d)) + rnd(0, 3);
  let s = genS, end = s + 10, type;
  genTut = tut < 6;
  if (tut < 6) type = ['t_block','t_low','t_high','t_wall','t_bridge','t_shards'][tut++];
  else {
    const pool = ['row','row','row','wall','holes','shards'];
    if (d > .05) pool.push('drone','combo','split');
    if (dist > 350 && genS - lastFork > 900) pool.push('fork','fork','fork','well','well','well');
    if (d > .25) pool.push('combo','split','holes','drone');
    if (d > .5)  pool.push('doublewall','gauntlet','combo');
    type = pool[ri(0, pool.length-1)];
  }
  const c = ri(0,1);
  switch(type){
    case 't_block': laneObs('block',1,s); hint(s,'<b>← →</b> pour changer de voie','<b>← →</b>','Glisse <b>à gauche</b> ou <b>à droite</b> pour changer de voie'); end = s+9; break;
    case 't_low': for (let l=0;l<3;l++) laneObs('low',l,s); shardLine(1,s-4,3,4,true); hint(s,'<b>↑</b> ou <b>ESPACE</b> pour sauter','<b>↑</b>','Glisse <b>vers le haut</b> pour sauter'); break;
    case 't_high': for (let l=0;l<3;l++) laneObs('high',l,s); hint(s,'<b>↓</b> pour glisser sous la barrière','<b>↓</b>','Glisse <b>vers le bas</b> pour passer dessous'); break;
    case 't_wall': phaseWall(0,3.9,s,1); addShard(0,1,s+.35); hint(s,'Mur <b style="color:var(--b)">ROSE</b> : deviens <b style="color:var(--b)">ROSE</b> (SHIFT) et tu passes au travers.','Mur <b style="color:var(--b)">ROSE</b> : <b>touche l\'écran</b> pour devenir <b style="color:var(--b)">ROSE</b><br>et passer au travers.'); break;
    case 't_bridge': end = holeRow(s, 20, [0,0,0]); shardLine(1, Math.ceil(s/TILE)*TILE+2, 5, 4); hint(s,'Sol <b style="color:var(--a)">BLEU</b> : redeviens <b style="color:var(--a)">BLEU</b> (SHIFT) pour marcher dessus.','Sol <b style="color:var(--a)">BLEU</b> : <b>touche l\'écran</b> pour redevenir <b style="color:var(--a)">BLEU</b><br>et marcher dessus.'); break;
    case 't_shards': for (let l=0;l<3;l++) if (l!==1) laneObs('block',l,s); shardLine(1,s,4,2.5); hint(s,'Une esquive mal engagée ? Maintiens <b style="color:var(--gold)">R</b> pour revenir en arrière — avant l\'impact.','Une esquive mal engagée ? Maintiens <b style="color:var(--gold)">TEMPS</b><br>pour revenir en arrière — avant l\'impact.'); end = s+9; break;
    case 'row': {
      const opts = ['none','low','high','block'], pick = [];
      do { pick.length=0; for (let l=0;l<3;l++) pick.push(opts[ri(0,3)]); }
      while (pick.every(p=>p==='block') || pick.every(p=>p==='none'));
      pick.forEach((p,l)=>{ if (p!=='none') laneObs(p,l,s); if (p==='low' && Math.random()<.5) shardLine(l,s-5,3,5,true); if (p==='none' && Math.random()<.4) shardLine(l,s,4,2.5); });
      end = s + (pick.includes('block') ? 9 : 1); break;
    }
    case 'wall': {
      if (Math.random() < .5) phaseWall(0,3.9,s,c);
      else { const bl = ri(0,2); for (let l=0;l<3;l++) l===bl ? laneObs('block',l,s) : phaseWall(LANES[l],1.15,s,c); }
      addShard(LANES[ri(0,2)], 1, s+.35); end = s+9; break;
    }
    case 'split': { // chaque voie a un mur de couleur différente
      const cols = [ri(0,1),ri(0,1),ri(0,1)]; if (cols.every(x=>x===cols[0])) cols[ri(0,2)] ^= 1;
      cols.forEach((cc,l)=>phaseWall(LANES[l],1.15,s,cc)); break;
    }
    case 'doublewall': phaseWall(0,3.9,s,c); phaseWall(0,3.9,s+sp*(.45-.1*d),c^1); end = s+sp*.45+1; break;
    case 'holes': {
      const len = TILE*ri(1, d>.4?4:3), br = [];
      for (let l=0;l<3;l++) br.push(len===TILE && Math.random()<.5 ? null : ri(0,1));
      if (br.every(b=>b===null)) br[ri(0,2)] = ri(0,1);
      end = holeRow(s, len, br);
      const sl = ri(0,2); if (br[sl]!==null) shardLine(sl, Math.ceil(s/TILE)*TILE+2, len/4, 4);
      break;
    }
    case 'combo': { // mur couleur c puis pont couleur c : double bascule
      phaseWall(0,3.9,s,c);
      end = holeRow(s + sp*.6, 20, [c^1,c^1,c^1]); shardLine(ri(0,2), Math.ceil((s+sp*.6)/TILE)*TILE+2, 5, 4); break;
    }
    case 'drone': {
      const l = ri(0,2), v = 9 + 6*d;
      addObs({type:'drone', x:LANES[l], hw:1.1, s:s+v*1.6, len:7, y0:0, y1:2.8, v});
      const o = (l + ri(1,2)) % 3; if (Math.random()<.6) laneObs(Math.random()<.5?'low':'high', o, s);
      end = s+9; break;
    }
    case 'gauntlet': {
      for (let l=0;l<3;l++) laneObs('low',l,s);
      phaseWall(0,3.9,s+sp*.5,c);
      for (let l=0;l<3;l++) laneObs('high',l,s+sp*1.0);
      end = s+sp*1.0+1; break;
    }
    case 'well': { // PUITS TEMPORELS : 3 portails, chute libre, un seul puits a le portail de retour
      lastFork = s;
      const ws = Math.ceil((s + 2)/TILE)*TILE, t1 = WELL_VT/WELL_G, d1 = .5*WELL_G*t1*t1;
      const tRet = t1 + (-WELL_RET_Y - 1.2 - d1)/WELL_VT;
      const wl = WELL_LEN, we = ws + wl, good = ri(0,2);
      for (let l=0;l<3;l++) for (let i=ws/TILE;i<we/TILE;i++) holes.set(l+':'+i, {phase:null, well:true, good, ws, we});
      for (let l=0;l<3;l++){ const tp = addObs({type:'tport', x:LANES[l], hw:1.15, s:ws-.8, len:.3, y0:0, y1:3.2}); tp.dest = ws + WELL_IN; }
      addObs({type:'wsign', x:0, hw:3.9, s:ws-1, len:.12, y0:3.9, y1:4.95});
      addObs({type:'shaft', x:0, hw:3.9, s:ws, len:wl, y0:-WELL_DEPTH, y1:0});
      const rs = ws + WELL_IN + tRet*WELL_DRIFT;
      addObs({type:'wring', x:LANES[good], hw:1.2, s:rs-1.5, len:3, y0:WELL_RET_Y-.6, y1:WELL_RET_Y-.5});
      addObs({type:'wexit', x:LANES[good], hw:1.15, s:we+.6, len:.3, y0:0, y1:3.2});
      for (let l=0;l<3;l++) if (l !== good) addObs({type:'wbottom', x:LANES[l], hw:1.2, s:ws, len:wl, y0:WELL_DIE_Y-2.1, y1:WELL_DIE_Y-2, mark: ws + WELL_IN + 3});
      end = we + 15; break;
    }
    case 'fork': { // CARREFOUR TEMPOREL : les 3 voies tombent dans un sous-sol ; un seul couloir a un tremplin de sortie
      lastFork = s;
      addObs({type:'gate', x:0, hw:3.9, s, len:.4, y0:0, y1:5.4});
      const hs = Math.ceil((s + 8)/TILE)*TILE, bl = Math.max(70, Math.ceil(sp*2.1/TILE)*TILE), he = hs + bl, good = ri(0,2);
      for (let l=0;l<3;l++) for (let i=hs/TILE;i<he/TILE;i++) holes.set(l+':'+i, {phase:null, base:true, good, he});
      for (const dx of [-1.3, 1.3]) addObs({type:'divider', x:dx, hw:.08, s:hs, len:bl, y0:BASE_Y, y1:BASE_Y+1.25});
      for (let l=0;l<3;l++){
        if (l === good){ const rl = Math.max(12, sp*.5 + 2); addObs({type:'ramp', x:LANES[l], hw:1.15, s:he-rl, len:rl, y0:BASE_Y, y1:BASE_Y+1.6}); }
        else addObs({type:'deadend', x:LANES[l], hw:1.25, s:he-.6, len:.6, y0:BASE_Y, y1:0});
        for (let i=0;i<4;i++) addShard(LANES[l], BASE_Y+1, hs+14+i*5);
      }
      hint(s,'<b style="color:var(--gold)">CARREFOUR TEMPOREL</b> : les 3 voies plongent au sous-sol, un seul couloir a un tremplin.<br>Mauvais couloir ? Maintiens <b style="color:var(--gold)">R</b> et choisis une autre voie avant le trou.',
             '<b style="color:var(--gold)">CARREFOUR TEMPOREL</b> : tout plonge au sous-sol,<br>un seul couloir a un tremplin. Mauvais couloir ?<br>Maintiens <b style="color:var(--gold)">TEMPS</b> et change de voie avant le trou.');
      end = he + Math.max(22, sp*1.15 + 2); break; // juste après l'atterrissage du tremplin
    }
    case 'shards': { const l = ri(0,2); shardLine(l,s,8,3); laneObs('low',l,s+12); end = s+14; break; }
  }
  genS = end;
  // sol
  while ((floorI+1)*TILE <= genS){
    for (let l=0;l<3;l++){
      const h = holes.get(l+':'+floorI);
      if (h && h.base){ // sous-sol : sol plat en contrebas + murs extérieurs + bord doré à l'entrée
        const f = new THREE.Mesh(TILE_G, matTile); scene.add(f); tiles.push({s:floorI*TILE, len:TILE, x:LANES[l], mesh:f, phase:null, y:BASE_Y});
        if (l !== 1){ const wm = new THREE.Mesh(BOX, matDark); wm.scale.set(.15, -BASE_Y, TILE); const grp = new THREE.Group(); wm.position.set(l===0 ? -1.3 : 1.3, BASE_Y/2, 0); grp.add(wm); scene.add(grp); tiles.push({s:floorI*TILE, len:TILE, x:LANES[l], mesh:grp, phase:null, y:0}); }
        if (!holes.has(l+':'+(floorI-1))){ const m = new THREE.Mesh(BOX, matChamp); m.scale.set(2.5,.1,.25); scene.add(m); tiles.push({s:floorI*TILE-.15, len:0, x:LANES[l], mesh:m, phase:null, edge:true}); }
        if (!holes.has(l+':'+(floorI+1))){ const m = new THREE.Mesh(BOX, matDark); m.scale.set(2.5,-BASE_Y,.3); const grp = new THREE.Group(); m.position.y = BASE_Y/2; grp.add(m); scene.add(grp); tiles.push({s:(floorI+1)*TILE+.15, len:0, x:LANES[l], mesh:grp, phase:null, y:0, wall:true}); }
        continue;
      }
      if (h && h.well) continue;
      if (h){ // fosse sous chaque case vide (même sous un pont de couleur)
        const pit = new THREE.Group();
        const dep = PIT_D;
        const box = new THREE.Mesh(BOX, matPit); box.scale.set(2.5, dep, TILE); box.position.y = -dep/2 - .01; pit.add(box);
        { const glow = new THREE.Mesh(PITGLOW_G, matPitGlow); glow.position.y = -PIT_D + .05; pit.add(glow); }
        scene.add(pit); tiles.push({s:floorI*TILE, len:TILE, x:LANES[l], mesh:pit, phase:null, y:0});
        for (const [edgeS, other] of [[floorI*TILE, floorI-1], [(floorI+1)*TILE, floorI+1]]){

      else { mesh = new THREE.Mesh(TILE_G, matTile); tiles.push({s:floorI*TILE, len:TILE, x:LANES[l], mesh, phase:null}); }
      scene.add(mesh);
    }
    floorI++;
  }
}
function genDeco(){
  decoS += rnd(14, 26);
  for (const side of [-1,1]){
    if (Math.random()<.9){
      const w = rnd(6,12), h = rnd(8,42), dd = rnd(10,20);
      const g = new THREE.Group(), x = side*(rnd(8.5,13)+w/2);
      const m = new THREE.Mesh(buildingGeo(w,h,dd), matBuilds[ri(0,matBuilds.length-1)]); m.position.set(x, h/2 - 2, 0); m.receiveShadow = true; g.add(m);
      const cap = new THREE.Mesh(BOX, matRoof); cap.scale.set(w+.4,.5,dd+.4); cap.position.set(x, h-1.75, 0); g.add(cap);
      if (h > 24 && Math.random()<.6){ const b = new THREE.Mesh(BOX, matBeacon); b.scale.set(.35,.35,.35); b.position.set(x, h-1.2, 0); g.add(b); }
      if (Math.random()<.5){ const u = new THREE.Mesh(BOX, matRoof); u.scale.set(rnd(1.5,3),rnd(1,2.5),rnd(1.5,3)); u.position.set(x+rnd(-w/4,w/4), h-1.5+u.scale.y/2, rnd(-dd/4,dd/4)); g.add(u); }
      g.userData.geo = m.geometry; scene.add(g);
      deco.push({s:decoS, len:dd, mesh:g, y:0});
    }
  }
  { for (const side of [-1,1]){ const l = lampPost(side); scene.add(l); deco.push({s:decoS, len:0, mesh:l, y:0}); } }
  if (Math.random() < .12){ // arche-horloge
    const g = new THREE.Group();
    g.add(new THREE.Mesh(ARCH_G, matGold));
    for (let i=0;i<=6;i++){ const a=i/6*Math.PI, t=new THREE.Mesh(BOX,matGold); t.scale.set(.06,.6,.06); t.position.set(Math.cos(a)*5.9,Math.sin(a)*5.9,0); t.rotation.z=a-Math.PI/2; g.add(t); }
    scene.add(g); deco.push({s:decoS, len:0, mesh:g, y:0, arch:true});
  }
}
function ensureWorld(){
  while (genS < dist + 240) genChunk();
  while (decoS < dist + 230) genDeco();
}
function cull(){
  const lim = dist - 420;
  const prune = a => a.filter(o => { const s = o.v ? objS(o) : o.s; if (s + (o.len||0) < lim){ scene.remove(o.mesh); if (o.mesh.userData.geo) o.mesh.userData.geo.dispose(); return false; } return true; });
  objs = prune(objs); tiles = prune(tiles); shards = prune(shards); deco = prune(deco);
  for (const k of holes.keys()){ if (+k.split(':')[1]*TILE < lim) holes.delete(k); }
}

const DT = 1/60;
const snapshot = ()=>[dist,gt,P.x,P.lane,P.y,P.vy,P.slide,P.phase,speed,P.falling,P.slideAfter,P.onG];
function restore(s){ [dist,gt,P.x,P.lane,P.y,P.vy,P.slide,P.phase,speed,P.falling,P.slideAfter,P.onG] = s; }
const objS = o => o.v ? o.s - o.v*(gt - o.t0) : o.s;
const nearestLane = x => x < -1.3 ? 0 : x > 1.3 ? 2 : 1;

function die(){
  state='dead'; deadT=0; deaths++; shake=.8; input.rewind=false; rwPointers.clear(); sfx.die(); buzz(120);
  burst(P.x, P.y+1, dist, COLS[P.phase], 50, 8, 1.2); burst(P.x, P.y+1, dist, 0xe8705f, 20, 6, .8);
}

// hauteur du sol sous le joueur : 0 = route, BASE_Y = sous-sol, -Infinity = vide
function groundAt(lane, s){
  const h = holes.get(lane+':'+Math.floor(s/TILE));
  if (!h) return 0;
  if (h.base) return BASE_Y;
  return (h.phase !== null && h.phase === P.phase) ? 0 : -Infinity;
}
function wellInfo(){ const h = holes.get(nearestLane(P.x)+':'+Math.floor(dist/TILE)); return h && h.well ? h : null; }
const inWell = () => !!wellInfo() && P.y < -.3;
function baseInfo(){ const h = holes.get(nearestLane(P.x)+':'+Math.floor(dist/TILE)); return h && h.base ? h : null; }
const inBasement = () => !!baseInfo() && P.y < -.3;
const inCorridor = () => inBasement() || inWell();
function physics(dt){
  gt += dt; speed = Math.min(52, speed + dt*.32); const pd = dist, wellNow = inWell(); dist += wellNow ? WELL_DRIFT*dt : speed*dt;
  for (const o of objs){
    if (o.type==='gate' && pd < o.s && dist >= o.s){ energy = 100; sfx.shard(); flashT = .5; toast('TEMPS RECHARGÉ', '#E3C58D'); }
    if (o.type==='tport' && pd < o.s && dist >= o.s && Math.abs(o.x - P.x) < 1.3){ energy = 100; dist = o.dest; P.y = -1.2; P.vy = -1; P.onG = false; wellK = 1; camY = P.y; timeScale = .45; warp(); sfx.resume(); buzz([15,30,15]); toast('TÉLÉPORTATION', '#F3E2BD'); burst(P.x, P.y+1, dist, 0xe3c58d, 24, 5, .7); break; }
  }
  maxDist = Math.max(maxDist, dist);
  energy = Math.min(100, energy + dt*1.2);
  const tx = LANES[P.lane]; P.x += (tx - P.x) * Math.min(1, dt*16);
  if (P.buf > 0) P.buf -= dt;
  if (P.buf > 0 && P.onG){ P.vy = JUMP_V; P.buf = 0; P.slide = 0; P.onG = false; sfx.jump(); }
  if (P.slide > 0) P.slide -= dt;
  // tremplin du bon couloir : propulse vers la route
  const bi = baseInfo(), lane = nearestLane(P.x);
  if (bi && P.onG && P.y < -1 && bi.good === lane && bi.he - dist <= speed*.45 + 1){
    P.vy = 27; P.onG = false; flashT = .6; sfx.resume(); buzz([20,40,20]); toast('TREMPLIN', '#E3C58D'); burst(P.x, P.y+.5, dist, 0xe3c58d, 30, 6, .8);
  }
  if (wellNow){ P.vy = Math.max(-WELL_VT, P.vy - WELL_G*dt);
    for (let k=0;k<2;k++){ if (parts.length >= MAXP) parts.shift(); parts.push({ x: rnd(-3.7,3.7), y: P.y - rnd(3, 16), s: dist + rnd(-5, 5), vx:0, vy:7, vs:0, life:1.1, max:1.1, c: DUST_C }); } }
  else P.vy -= GRAV*dt;
  P.y += P.vy*dt;
  const gH = groundAt(lane, dist);
  if (P.vy <= 0 && P.y <= gH && P.y > gH - .7){
    if (!P.onG && P.y < -1) { sfx.land && sfx.slide(); shake = .3; }
    P.y = gH; P.vy = 0; P.onG = true; if (P.slideAfter){ P.slide = SLIDE_T; P.slideAfter = false; }
  } else P.onG = false;
  P.falling = !P.onG && P.y < -.05;
  if (gH > -Infinity && P.y < gH - .7){ die(); return; }   // on percute un mur (fin de couloir, bord de trou)
  const wi = P.y < -.3 ? wellInfo() : null;
  if (wi){
    if (wi.good === lane && P.y < WELL_RET_Y){ // portail de retour : on réapparaît sur la route, plus loin
      dist = wi.we + 1.2; P.y = 1.2; P.vy = 3; P.onG = false; camY = 0; wellK = 0; timeScale = .3; flashT = .4; shake = .15; warp();
      sfx.resume(); buzz([20,40,20]); toast('RETOUR SUR LA ROUTE', '#E3C58D'); burst(P.x, P.y+.5, dist, 0xe3c58d, 30, 6, .8); return;
    }
    if (P.y < WELL_DIE_Y){ die(); return; }
  }
  else if (gH === -Infinity && P.y < -4){ die(); return; }       // chute dans le vide
  const ph = P.slide > 0 ? .8 : 1.75;
  for (const o of objs){
    const os = objS(o);
    if (os > dist + 2 || os + o.len < dist - 1) continue;
    if (o.phase !== null && o.phase === P.phase) continue; // même couleur que toi : tu passes au travers
    if (o.type==='gate' || o.type==='divider' || o.type==='ramp' || o.type==='deadend' || o.type==='tport' || o.type==='shaft' || o.type==='wring' || o.type==='wbottom' || o.type==='wexit' || o.type==='wsign') continue;
    if (Math.abs(P.x - o.x) < .38 + o.hw && dist + .35 > os && dist - .35 < os + o.len && P.y < o.y1 && P.y + ph > o.y0){ die(); return; }
  }
  for (const sh of shards){
    if (sh.taken || Math.abs(sh.s - dist) > 1.3) continue;
    if (Math.abs(sh.x - P.x) < 1 && Math.abs(sh.y - (P.y + ph/2)) < 1.3){
      sh.taken = true; sh.mesh.visible = false; buzz(5); energy = Math.min(100, energy + 8); shardsTaken++; sfx.shard();
      burst(sh.x, sh.y, sh.s, 0xe3c58d, 10, 4, .5);
    }
  }
}

function step(){
  for (const p of parts){ p.x += p.vx*DT; p.y += p.vy*DT; p.s += p.vs*DT; p.vy -= 12*DT; p.life -= DT; }
  parts = parts.filter(p => p.life > 0);
  shake *= .88;
  if (state === 'play'){
    if (input.rewind && snaps.length > 2 && energy > 1){ state = 'rewind'; rewindMin = 0; rewindSound(true); }
    else {
      timeScale = Math.min(1, timeScale + DT*1.4);
      snaps.push(snapshot()); if (snaps.length > 480) snaps.shift();
      physics(DT*timeScale);
    }
  } else if (state === 'rewind'){
    for (let k=0;k<3;k++){ if (snaps.length <= 1 || energy <= 0) break; restore(snaps.pop()); energy -= .3; rewindMin--; rewoundTotal++; }
    if ((!input.rewind && rewindMin <= 0) || snaps.length <= 1 || energy <= 0){ state='play'; timeScale=.25; rewindSound(false); sfx.resume(); }
  } else if (state === 'dead'){
    deadT += DT;
    if (deadT > 1.3) gameOver();
  } else if (state === 'over') overT += DT;
  if (state !== 'menu' && state !== 'over'){ ensureWorld(); if (Math.random() < .05) cull(); }
}
function gameOver(){
  state='over'; overT=0; const sc = pts(maxDist);
  newBest = sc > best; if (newBest){ best = sc; localStorage.setItem('chronophase_rush_score', best); }
  try{ parent.postMessage({type:'chronophase:over',score:sc,duration:Math.round((performance.now()-(window.__lsStart||performance.now()))/1000)},'*'); }catch(_){}
  buzz([30,50,30]);
  showOverlay(`<div class="scrim"></div><div style="position:relative;display:flex;flex-direction:column;align-items:center">
    <div class="broken">FIN DE LA BOUCLE</div>
    <div class="big" style="margin-top:18px">${sc}<span>pts</span></div>
    <div class="muted" style="margin-top:8px">${Math.floor(maxDist)} M PARCOURUS</div>
    ${newBest ? '<div class="badge">NOUVEAU RECORD</div>' : ''}
    <div class="stats glass">
      <div>${best}<small>RECORD</small></div>
      <div>${shardsTaken}<small>ÉCLATS</small></div>
      <div>${(rewoundTotal/60).toFixed(1)}s<small>REMBOBINÉ</small></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;width:min(300px,86vw)"><button class="cta" data-start>REJOUER</button><button class="ghost" data-home>ACCUEIL</button></div></div>`);
}

// ============ INPUT ============
let touchUI = IS_TOUCH;
function buzz(p){ if (IS_TOUCH && navigator.vibrate) try{ navigator.vibrate(p); }catch(e){} }
function goFull(){
  if (!REAL_TOUCH || document.fullscreenElement) return;
  const el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
  if (f) try{ const r = f.call(el, {navigationUI:'hide'}); if (r && r.catch) r.catch(()=>{}); }catch(e){}
}
function act(a){
  au();
  if (state === 'menu' || (state === 'over' && overT > .6)){ if (a==='jump'||a==='tap'){ goFull(); start(); } return; }
  if (paused){ if (a==='tap'||a==='jump') paused = false; return; }
  if (state !== 'play') return;
  if ((a==='left' || a==='right') && inCorridor()){ tone(140,.08,'sine',.08,90); buzz(20); }
  else if (a==='left' && P.lane > 0){ P.lane--; sfx.lane(); buzz(8); }
  else if (a==='right' && P.lane < 2){ P.lane++; sfx.lane(); buzz(8); }
  else if (a==='jump'){ P.buf = .16; buzz(8); }
  else if (a==='slide'){ if (!P.onG){ if (P.vy > -24) P.vy = -24; P.slideAfter = true; } else { P.slide = SLIDE_T; } sfx.slide(); buzz(8); }
  else if (a==='phase' || a==='tap'){ P.phase ^= 1; phaseToast(); sfx.phase(P.phase); buzz(15); burst(P.x, P.y+1, dist, COLS[P.phase], 16, 4, .5); }
}
const KEYS = { ArrowLeft:'left', KeyA:'left', KeyQ:'left', ArrowRight:'right', KeyD:'right', ArrowUp:'jump', KeyW:'jump', KeyZ:'jump', Space:'jump',
  ArrowDown:'slide', KeyS:'slide', ShiftLeft:'phase', ShiftRight:'phase', KeyE:'phase', KeyX:'phase' };
addEventListener('keydown', e=>{
  if (e.code==='KeyR'){ e.preventDefault(); au(); if (!e.repeat) input.rewind = true; return; }
  if (e.code==='KeyP'||e.code==='Escape'){ togglePause(); return; }
  const a = KEYS[e.code]; if (!a) return; e.preventDefault(); if (!e.repeat) act(a);
});
addEventListener('keyup', e=>{ if (e.code==='KeyR') input.rewind = false; });
function togglePause(force){ if (state==='play'||state==='rewind'){ paused = force ?? !paused; if (paused){ input.rewind=false; rewindSound(false); } } }
addEventListener('blur', ()=>togglePause(true));
document.addEventListener('visibilitychange', ()=>{ if (document.hidden) togglePause(true); });
addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('gesturestart', e=>e.preventDefault());

// --- boutons tactiles (multi-touch via pointer events) ---
const rwPointers = new Set();
for (const b of document.querySelectorAll('.b')){
  const a = b.dataset.a;
  b.addEventListener('pointerdown', e=>{
    e.preventDefault(); e.stopPropagation(); au(); b.classList.add('down');
    try{ b.setPointerCapture(e.pointerId); }catch(_){}
    if (a==='rewind'){ rwPointers.add(e.pointerId); input.rewind = true; buzz(12); } else act(a);
  });
  const up = e=>{ b.classList.remove('down'); if (a==='rewind'){ rwPointers.delete(e.pointerId); if (!rwPointers.size) input.rewind = false; } };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
}
$('pauseBtn').addEventListener('pointerdown', e=>{ e.preventDefault(); e.stopPropagation(); togglePause(); });
// --- menus : boutons dans l'overlay ---
$('overlay').addEventListener('pointerdown', e=>{
  if (e.target.closest('[data-exit]')){ e.preventDefault(); try{ parent.postMessage({type:'chronophase:exit'},'*'); }catch(_){} return; }
  const t = e.target.closest('[data-start],[data-resume],[data-restart],[data-home],[data-menu],[data-skin]'); if (!t) return;
  if (t.hasAttribute('data-skin')){ e.preventDefault(); au(); openSkins(); return; }
  e.preventDefault(); au();
  if (t.hasAttribute('data-menu')){ t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop'); buzz(8); return; } // menu d'accueil : pas encore actif
  if (t.hasAttribute('data-restart')){ paused = false; rewindSound(false); start(); return; }
  if (t.hasAttribute('data-home')){ goHome(); return; }
  if (t.hasAttribute('data-resume')) paused = false;
  else act('tap');
});
// --- swipes sur l'écran (toujours actifs, enchaînables sans lever le doigt) ---
const cvs = renderer.domElement, swipes = new Map();
cvs.addEventListener('pointerdown', e=>{ e.preventDefault(); au(); swipes.set(e.pointerId, {x:e.clientX, y:e.clientY, moved:false}); });
cvs.addEventListener('pointermove', e=>{
  const s = swipes.get(e.pointerId); if (!s || s.moved) return;
  const dx = e.clientX - s.x, dy = e.clientY - s.y, th = Math.max(22, Math.min(innerWidth, innerHeight)*.06);
  if (Math.max(Math.abs(dx), Math.abs(dy)) > th){
    if (s.moved) return;            // une seule action par swipe : il faut relever le doigt
    s.moved = true;
    act(Math.abs(dx) > Math.abs(dy) ? (dx<0?'left':'right') : (dy<0?'jump':'slide'));
  }
});
const swEnd = e=>{ const s = swipes.get(e.pointerId); swipes.delete(e.pointerId); if (s && !s.moved && e.type==='pointerup') act('tap'); };
cvs.addEventListener('pointerup', swEnd); cvs.addEventListener('pointercancel', swEnd);
